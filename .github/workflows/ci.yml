name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIRON_SSL_MYSQL_TEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ssl-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: viron_ssl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      VIRON_SSL_MYSQL_TEST: "1"
      VIRON_SSL_MYSQL_HOST: 127.0.0.1
      VIRON_SSL_MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run MariaDB certificate suite
        run: npx vitest run tests/ssl-asset-mysql.test.ts
