function actors(node,r){let ids=node.approverKind==='role'?db.users.filter(u=>db.grants.some(g=>active(g)&&applies(g,u)&&g.roleId===node.roleId&&requestTargets(r).every(id=>covers(g.scope,id)))).map(u=>u.id):node.approverIds||[];ids=[...new Set(ids)].filter(id=>user(id));if(node.samePerson==='skip')ids=ids.filter(id=>id!==r.user);return ids}
function snapshotActors(r){r.workflow.nodes.filter(n=>n.kind==='approval'&&n.approvalType==='manual').forEach(n=>{n.selectionSnapshot={kind:n.approverKind,roleId:n.roleId,memberIds:[...n.approverIds]};n.approverIds=actors(n,r);n.approverKind='member'})}
function pendingActors(r,node){const ids=actors(node,r),done=r.approvals[node.id]||[];if(node.mode==='sequential')return ids.filter(id=>!done.includes(id)).slice(0,1);if(node.mode==='or'&&done.some(id=>ids.includes(id)))return [];return ids.filter(id=>!done.includes(id))}
function nodeDone(r,node){const ids=actors(node,r),done=r.approvals[node.id]||[];return ids.length>0&&(node.mode==='or'?ids.some(id=>done.includes(id)):ids.every(id=>done.includes(id)))}
function canActOn(r,decision='approve'){const n=r.workflow.nodes[r.stage];if(r.status!=='pending'||!n||n.kind==='cc'||n.approvalType!=='manual')return false;return pendingActors(r,n).includes(state.persona)&&requestTargets(r).every(id=>can(decision==='reject'?'approval.reject':'approval.approve',id))}
function validateRequestActors(r){for(const n of r.workflow.nodes){if(n.kind==='cc'||n.approvalType!=='manual')continue;const ids=actors(n,r);if(!ids.length)return '「'+n.name+'」没有有效审批人，请组织调整流程';if(!ids.some(uid=>requestTargets(r).every(id=>can('approval.approve',id,user(uid)))))return '「'+n.name+'」的审批人没有申请范围内的审批权限';if(n.mode!=='or'&&ids.some(uid=>!requestTargets(r).every(id=>can('approval.approve',id,user(uid)))))return '会签或顺序审批要求所有审批人都具有对应范围的审批权限'}return ''}
function requestProblem(r){if(r.kind!=='feature'&&!role(r.roleId)?.enabled)return '申请角色已停用，请重新申请';if(!r.scope.ids.every(id=>r.scope.kind==='connection'?!!connection(id):r.scope.kind==='environment_group'?db.groups.some(g=>g.id===id):!!env(id)))return '申请资源已变更，请重新申请';const live=requestTargets({scope:r.scope});if(r.targetIds&&(live.length!==r.targetIds.length||live.some(id=>!r.targetIds.includes(id))))return '申请资源关联已变更，请按当前范围重新申请';return ''}
function grantRequest(r){
 const problem=requestProblem(r);if(problem)return problem;const startsAt=new Date().toISOString(),base={name:r.name,subjectType:'user',subject:r.user,scope:structuredClone(r.scope),enabled:true,startsAt,expiresAt:r.durationHours?new Date(Date.parse(startsAt)+r.durationHours*3600000).toISOString():null,reason:r.reason,source:'request',requestId:r.id};
 r.grantIds=[];
 if(r.kind!=='feature'){const g={id:uid('grant'),...base,roleId:r.roleId};db.grants.push(g);r.grantId=g.id;r.grantIds.push(g.id)}
 if(r.kind==='feature'||r.kind==='combined'){const g={id:uid('feature'),...base,features:structuredClone(r.features)};db.featureGrants.push(g);r.featureGrantId=g.id;r.grantIds.push(g.id)}
 r.status='approved';record(requestKind(r)+'生效',r.name,(r.kind==='feature'?'资源功能':role(r.roleId).name)+' · '+r.workflow.name,requestTargets(r));return '';
}
function settleRequest(r){let guard=0;while(r.status==='pending'&&guard++<100){const n=r.workflow.nodes[r.stage];if(!n)return grantRequest(r);if(n.kind==='cc'||n.approvalType==='pass'){r.history.push({node:n.id,decision:n.kind==='cc'?'抄送':'自动通过',time:new Date().toISOString()});r.stage++;continue}if(n.approvalType==='reject'){r.status='rejected';return ''}if(nodeDone(r,n)){r.stage++;continue}if(!actors(n,r).length)return '当前节点没有有效审批人，请组织维护流程';return ''}return ''}
function showReview(id){const r=db.requests.find(r=>r.id===id);if(!r||!visibleRequests().some(x=>x.id===id))return;const n=r.workflow.nodes[r.stage];const act=canActOn(r),reject=canActOn(r,'reject');const flow=r.workflow.nodes.map((n,i)=>`<div class="review-stage"><span class="stage-number ${r.status==='pending'&&i===r.stage?'pending':''}">${i<r.stage||r.status==='approved'?icon('check'):i+1}</span><div class="grow"><strong>${esc(n.name)}</strong><p>${n.kind==='cc'?'抄送 '+(n.ccIds||[]).map(uid=>user(uid)?.name).join('、'):n.approvalType==='manual'?actors(n,r).map(uid=>user(uid)?.name).join('、')+' · '+({or:'任一人通过',and:'全部人通过',sequential:'顺序审批'})[n.mode]:n.approvalType==='pass'?'自动通过':'自动拒绝'}</p></div>${r.status==='pending'&&i===r.stage?'<span class="badge amber">当前节点</span>':''}</div>`).join('');openModal('授权申请详情',r.name,`<div class="management-card"><h3>${esc(user(r.user)?.name)} · ${requestKind(r)}</h3><p>${esc(scopeLabel(r.scope))}</p><p>${esc(r.reason)}</p><p>${requestContent(r)}</p><p>审批流程：${esc(r.workflow.name)}（提交时快照）</p><small>时长 ${r.durationHours?r.durationHours+' 小时':'永久'}，从审批完成后计时。数据授权和功能授权独立保存；实际使用需同时满足两者。</small></div><div class="review-flow">${flow}</div>${r.status==='pending'?field('处理意见','<textarea id="decision-reason" aria-label="处理意见"></textarea>'):''}${act&&(n.allowTransfer||n.allowAddSign||n.allowRollback)?`<div class="form-grid">${field('转交 / 加签人员',select('decision-person',db.users.filter(u=>u.id!==r.user&&requestTargets(r).every(id=>can('approval.approve',id,u))).map(u=>[u.id,u.name]),'u1'))}${n.allowRollback&&r.stage?field('回退节点',select('decision-stage',r.workflow.nodes.slice(0,r.stage).filter(x=>x.kind!=='cc').map(x=>[x.id,x.name]),r.workflow.nodes[0].id)):''}</div><div class="wf-ops">${n.allowTransfer?`<button class="btn small" data-action="decision" data-id="${id}" data-decision="transfer">转交</button>`:''}${n.allowAddSign?`<button class="btn small" data-action="decision" data-id="${id}" data-decision="add-sign">加签</button>`:''}${n.allowRollback&&r.stage?`<button class="btn small" data-action="decision" data-id="${id}" data-decision="rollback">回退</button>`:''}</div>`:''}${r.history.length?`<div class="section-head"><h3>处理记录</h3></div>${r.history.map(h=>`<p>${esc(h.actor||'系统')} · ${esc(h.decision)} · ${esc(h.reason||'')}</p>`).join('')}`:''}`,`${r.status==='pending'&&r.user===state.persona?`<button class="btn" data-action="decision" data-id="${id}" data-decision="withdraw">撤回</button>`:''}<button class="btn" data-action="close-modal">关闭</button>${reject?`<button class="btn danger" data-action="decision" data-id="${id}" data-decision="reject">拒绝</button>`:''}${act?`<button class="btn primary" data-action="decision" data-id="${id}" data-decision="approve">通过</button>`:''}`)}
function decide(id,decision){const r=db.requests.find(r=>r.id===id);if(!r||r.status!=='pending')return error('申请已处理');const reason=document.querySelector('#decision-reason').value.trim(),n=r.workflow.nodes[r.stage];if(decision==='withdraw'){if(r.user!==state.persona)return error('只能撤回自己的申请');if(!reason)return error('请填写撤回原因');r.status='withdrawn'}else{if(!canActOn(r,decision==='reject'?'reject':'approve'))return error('没有当前节点与资源范围的审批权限');if((n.commentRequired||decision!=='approve')&&!reason)return error('请填写处理意见');if(decision==='reject')r.status='rejected';else if(decision==='approve'){const issue=requestProblem(r);if(issue)return error(issue);r.approvals[n.id]=[...new Set([...(r.approvals[n.id]||[]),state.persona])];if(nodeDone(r,n))r.stage++;const problem=settleRequest(r);if(problem){persist();return error(problem)}}else if(decision==='transfer'||decision==='add-sign'){if(decision==='transfer'&&!n.allowTransfer||decision==='add-sign'&&!n.allowAddSign)return error('该操作未启用');const picked=document.querySelector('#decision-person').value;if(!picked||!requestTargets(r).every(id=>can('approval.approve',id,user(picked))))return error('请选择具有对应范围审批权限的成员');const people=actors(n,r);if(people.includes(picked))return error('请选择当前节点之外的审批人，避免重复转交或加签');n.approverKind='member';n.approverIds=decision==='transfer'?people.map(p=>p===state.persona?picked:p):[...new Set([...people,picked])];if(decision==='add-sign')n.mode='and'}else if(decision==='rollback'){if(!n.allowRollback)return error('未允许回退');const target=r.workflow.nodes.findIndex(x=>x.id===document.querySelector('#decision-stage').value);if(target<0||target>=r.stage)return error('请选择之前的节点');r.stage=target;r.workflow.nodes.slice(target).forEach(x=>delete r.approvals[x.id])}else return}
 r.history.push({node:n?.id,decision:({approve:'通过',reject:'拒绝',withdraw:'撤回',transfer:'转交', 'add-sign':'加签',rollback:'回退'})[decision],actor:current().name,reason,time:new Date().toISOString()});record('审批'+r.history.at(-1).decision,r.name,reason,requestTargets(r));persist();render();showReview(id);toast(r.status==='approved'?'审批完成，对应类型的授权已生效':'申请状态已更新')}
function readWorkflow(){const d=state.workflowDraft;if(!d)return;d.name=document.querySelector('#workflow-name').value;d.scope.mode=document.querySelector('#workflow-scope-mode').value;d.scope.connectionIds=[...document.querySelectorAll('.flow-connection:checked')].map(x=>x.value);d.scope.environmentIds=[...document.querySelectorAll('.flow-environment:checked')].map(x=>x.value);d.nodes.forEach(n=>{const card=document.querySelector('[data-node="'+n.id+'"]');if(!card)return;n.name=card.querySelector('.node-name').value;n.kind=card.querySelector('.node-kind').value;n.approvalType=card.querySelector('.node-type').value;n.approverKind=card.querySelector('.node-approver-kind').value;n.roleId=card.querySelector('.node-role').value;n.approverIds=[...card.querySelectorAll('.node-person:checked')].map(x=>x.value);n.ccIds=[...card.querySelectorAll('.node-cc:checked')].map(x=>x.value);n.mode=card.querySelector('.node-mode').value;n.samePerson=card.querySelector('.node-self').value;n.commentRequired=card.querySelector('.node-comment').checked;n.allowTransfer=card.querySelector('.node-transfer').checked;n.allowAddSign=card.querySelector('.node-sign').checked;n.allowRollback=card.querySelector('.node-rollback').checked})}

icle>`).join('')}<small>流程与范围修改只影响后续提交的申请，现有申请保留快照。</small>`}
function showWorkflow(id,fresh=false){if(!can('approval.workflow'))return;if(fresh||!state.workflowDraft){const found=id?db.workflows.find(f=>f.id===id):null;state.workflowDraft=found?structuredClone(found):{id:uid('workflow'),name:'',scope:{mode:'all',connectionIds:[],environmentIds:[]},nodes:[defaultNode(uid('node'),'授权审核',[])]}}const scroll=document.querySelector('.workflow-modal .modal-body')?.scrollTop||0;openModal('审批流程与授权范围','直接指定适用连接或环境；每个连接只进入一条流程。',workflowBody(),`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-workflow">保存流程</button>`,'workflow-modal');document.querySelector('.workflow-modal .modal-body').scrollTop=scroll}
function saveWorkflow(){readWorkflow();const f=state.workflowDraft;f.name=f.name.trim();if(!f.name)return error('请输入流程名称');if(db.workflows.some(w=>w.id!==f.id&&w.name===f.name))return error('流程名称已存在');if(f.scope.mode==='all'&&db.workflows.some(w=>w.id!==f.id&&w.scope.mode==='all'))return error('组织已存在“所有连接”默认流程，请改为指定范围');if(f.scope.mode==='selected'&&!f.scope.connectionIds.length)return error('请选择至少一个连接');const clash=f.scope.mode==='selected'?db.workflows.find(w=>w.id!==f.id&&w.scope.mode==='selected'&&w.scope.connectionIds.some(id=>f.scope.connectionIds.includes(id))):null;if(clash){const names=clash.scope.connectionIds.filter(id=>f.scope.connectionIds.includes(id)).map(id=>{const c=connection(id);return CAPABILITIES[c.cap].label+' · '+c.name+'（'+(c.envs.map(id=>env(id)?.name).join('、')||'独立资源')+'）'});return error('与「'+clash.name+'」重叠：'+names.join('；')+'。请先调整原归属')}if(!f.nodes.length)return error('至少保留一个节点');for(const n of f.nodes){if(!n.name.trim())return error('请填写节点名称');if(n.kind==='cc'&&!n.ccIds.length)return error('请指定抄送人');if(n.kind==='approval'&&n.approvalType==='manual'&&(n.approverKind==='member'?!n.approverIds.length:!n.roleId))return error('请为「'+n.name+'」指定审批人或角色')}
 const before=structuredClone(db.workflows),existing=db.workflows.findIndex(w=>w.id===f.id);if(existing<0)db.workflows.push(structuredClone(f));else db.workflows[existing]=structuredClone(f);if(db.workflows.filter(w=>w.scope.mode==='all').length!==1){db.workflows=before;return error('组织必须保留一条默认审批流程，承接未分配连接')}record('维护审批流程',f.name,flowConnectionIds(f).length+' 个实际覆盖连接；已有申请保留快照',flowConnectionIds(f));state.page='reviews';state.reviewTab='flows';afterSave('流程与范围已保存')}
function showFlowConnections(id){const f=db.workflows.find(w=>w.id===id);openModal('流程实际覆盖资源',f.name,table(['资源','类型','环境'],flowConnectionIds(f).map(id=>{const c=connection(id);return `<tr><td>${esc(c.name)}</td><td>${CAPABILITIES[c.cap].label}</td><td>${c.envs.map(e=>esc(env(e)?.name)).join('、')||'独立资源'}</td></tr>`}).join('')))}
function showNotes(){openModal('已确认的设计约定','此原型表达拟实施的设计，未修改 Viron 正式业务权限。',`<div class="management-card"><h3>功能权限 · 角色</h3><p>角色权限码定义可执行的操作，如查询、写入、终端登录、组织管理。角色页直接维护已授权成员、子组织、数据范围与有效期，不另设“授权规则”菜单。</p></div><div class="management-card"><h3>数据权限 · 资源范围</h3><p>数据授权 = 成员或子组织 + 角色 + 数据范围 + 有效期。独立连接可直接授权；环境、职责关联、角色名称和负责人不授予额外权限。</p></div><div class="management-card"><h3>资源功能授权 · MCP / Agent / Web 插件</h3><p>功能授权 = 成员或子组织 + 环境或连接 + 允许的功能 + 有效期。记录不含角色；修改、更换、停用角色不会改写该记录。实际执行须同时满足角色操作权限、数据范围与有效功能授权。</p><p>Web 插件按当前环境判定，未授权环境全部禁用。证书、密钥随连接作为认证依赖，不独立授权使用。</p></div><div class="management-card"><h3>审批与剩余时长</h3><p>申请明确区分数据授权和功能授权，审批生成各自记录，时长从通过后计时。同一个连接只能进入一个审批流程。资源使用界面后续需显示限时操作的剩余时长，永久不显示。</p></div><p><a href="../docs/ORGANIZATION-RESOURCE-DESIGN.md" target="_blank" rel="noopener">打开完整设计约定文档</a></p>`)}
function showSettings(){openModal('原型设置','示例操作仅保存在本浏览器。',`<div class="management-card"><h3>恢复示例数据</h3><p>恢复本版组织、角色、授权和审批流程，不读取旧版存储。</p><button class="btn danger" data-action="reset-data">恢复示例</button></div>`,'','narrow')}
document.addEventListener('change',event=>{const el=event.target;
 if(el.id==='grant-subject-type'){refreshSubject();refreshGrantPreview()}
 else if(el.id==='resource-association-filter'){const org=el.dataset.context==='org';state[org?'orgResourceEnvironment':'catalogEnvironment']=el.value;render()}
 else if(el.id==='grant-scope-kind')refreshGrantTargets();
 else if(el.id==='grant-duration')refreshGrantEnd();
 else if(['grant-role','grant-mcp','grant-agent','grant-web-plugins','grant-descendants'].includes(el.id)||el.classList.contains('grant-target'))refreshGrantPreview();
 else if(el.classList.contains('role-module')){const m=MODULES.find(m=>m.id===el.dataset.module);m.items.forEach(([c])=>document.querySelector('.permission-code[data-code="'+c+'"]').checked=el.checked)}
 else if(el.id==='workflow-scope-mode'){readWorkflow();document.querySelector('#workflow-targets').hidden=el.value==='all'}
 else if(el.classList.contains('flow-environment')){const e=el.value;document.querySelectorAll('.flow-connection').forEach(x=>{if(connection(x.value).envs.includes(e))x.checked=el.checked});readWorkflow()}
 else if(el.closest('.workflow-modal'))readWorkflow();
});
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;if((b.classList.contains('overlay')||b.classList.contains('modal-wrap'))&&event.target!==b)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case 'page':state.accessResource=null;state.page=id;state.search='';state.sidebar=false;closeDetail();render();break;
 case 'team':state.accessResource=null;state.team=id;state.page='organization';state.search='';state.orgResourceEnvironment='all';state.orgResourceKind='environment';closeDetail();render();break;
 case 'org-tab':state.orgTab=id;state.search='';render();break;
 case 'org-resource-kind':state.orgResourceKind=id;state.orgResourceEnvironment='all';state.search='';render();break;
 case 'resource-association':{const org=b.dataset.context==='org';state[org?'orgResourceEnvironment':'catalogEnvironment']=id;state.search='';render();break}
 case 'resource-access':showResourceAccess(id);break;
 case 'access-tab':showResourceAccess(state.accessResource,id);break;
 case 'role-tab':state.roleTab=id;render();break;
 case 'feature-resource':showGrant(null,false,null,{kind:connection(id)?'connection':'environment',ids:[id]},'feature');break;
 case 'request-feature-resource':showGrant(null,true,null,{kind:connection(id)?'connection':'environment',ids:[id]},'feature');break;
 case 'edit-feature-grant':showGrant(id,false,null,null,'feature');break;
 case 'request-features':showGrant(null,true,null,null,'feature');break;
 case 'preview-web-plugins':closeModal();openDetail(env(id)?'environment':'connection',id);break;
 case 'request-resource':showGrant(null,true,null,{kind:connection(id)?'connection':'environment',ids:[id]});break;
 case 'grant-resource':showGrant(null,false,null,{kind:connection(id)?'connection':'environment',ids:[id]});break;
 case 'lens':state.lens=id;state.catalogEnvironment='all';state.search='';render();break;
 case 'role':state.role=id;state.roleTab='permissions';render();break;
 case 'review-tab':state.reviewTab=id;render();break;
 case 'mine-tab':state.mineTab=id;render();break;
 case 'sidebar':state.sidebar=!state.sidebar;render();break;
 case 'reset-persona':state.persona='u1';closeDetail();render();break;
 case 'notes':showNotes();break;case 'settings':showSettings();break;
 case 'reset-data':db=buildSeed();Object.assign(state,{page:'resources',team:'root',persona:'u1',role:'role-01',detail:null,search:'',lens:'environment',orgResourceKind:'environment',orgResourceEnvironment:'all',catalogEnvironment:'all'});persist();closeModal();closeDetail();render();toast('已恢复示例');break;
 case 'environment':case 'connection':case 'member':openDetail(a,id);break;
 case 'grant-detail':{const g=authorization(id);if(g&&(applies(g,current())||mayManageScope(g.scope,'authorization.view'))){closeModal();openDetail('grant',id)};break}
 case 'close-detail':closeDetail();break;case 'close-modal':closeModal();break;
 case 'create-role':showRoleEditor();break;case 'edit-role':showRoleEditor(id);break;case 'clone-role':showRoleEditor(id,true);break;case 'save-role':saveRole();break;
 case 'toggle-role':{if(!can('role.update'))break;const r=role(id);openModal(r.enabled?'停用角色':'启用角色',r.name,`<p>会影响 ${db.grants.filter(g=>g.roleId===id).length} 条角色分配的操作权限；独立的资源功能授权记录保持原状态。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-role-toggle" data-id="${id}">确认</button>`,'narrow');break}
 case 'confirm-role-toggle':{if(!can('role.update'))break;const r=role(id);r.enabled=!r.enabled;if(!retainAdministration()){r.enabled=!r.enabled;error('至少保留有效的组织角色维护与授权能力');break}record(r.enabled?'启用角色':'停用角色',r.name,'引用此角色的授权同步重新计算');afterSave('角色状态已更新');break}
 case 'delete-role':{if(!can('role.delete'))break;const r=role(id);const used=db.grants.some(g=>g.roleId===id)||db.requests.some(q=>q.roleId===id&&q.status==='pending')||db.workflows.some(w=>w.nodes.some(n=>n.approverKind==='role'&&n.roleId===id));openModal('删除角色',r.name,used?'<p>仍有授权、待审批申请或审批节点引用此角色，请先解除引用。</p>':'<p>删除后台账保留。</p>',`<button class="btn" data-action="close-modal">关闭</button>${used?'':`<button class="btn danger" data-action="confirm-delete-role" data-id="${id}">删除</button>`}`,'narrow');break}
 case 'confirm-delete-role':{if(!can('role.delete')||db.grants.some(g=>g.roleId===id)||db.requests.some(r=>r.roleId===id&&r.status==='pending')||db.workflows.some(w=>w.nodes.some(n=>n.approverKind==='role'&&n.roleId===id)))break;const r=role(id);db.roles=db.roles.filter(r=>r.id!==id);record('删除角色',r.name,'删除未被引用的角色');state.role=db.roles[0].id;afterSave('角色已删除');break}
 case 'grant':showGrant();break;case 'grant-role':state.accessResource=null;showGrant(null,false,id);break;case 'edit-grant':showGrant(id);break;case 'save-grant':saveGrant();break;
 case 'request':showGrant(null,true);break;case 'request-env':showGrant(null,true,null,{kind:'environment',ids:[id]});break;case 'request-connection':showGrant(null,true,null,{kind:'connection',ids:[id]});break;
 case 'toggle-grant':confirmGrantChange(id);break;case 'revoke':confirmGrantChange(id,true);break;case 'confirm-grant-change':applyGrantChange(id,b.dataset.revoke==='true');break;
 case 'create-env':showEnvironment();break;case 'edit-env':showEnvironment(id);break;case 'save-env':saveEnvironment(id);break;case 'create-team':showTeam();break;case 'save-team':saveTeam();break;
 case 'invitation':showInvitation();break;case 'save-invite':{if(!can('member.invite',state.team))break;const name=document.querySelector('#invite-name').value.trim(),max=Number(document.querySelector('#invite-limit').value);if(!name||!Number.isInteger(max)||max<1||max>100){error('请填写名称和 1 至 100 的人数上限');break}const i={id:uid('invite'),name,max,team:state.team};db.invitations.push(i);record('生成邀请',name,'子组织：'+team(state.team).name);persist();openModal('邀请已生成','仅为演示链接，不会真实发送。',`<div class="management-card"><p>${esc(name)} · 最多 ${max} 人</p><code>https://invite.example.com/${i.id}</code></div>`,'','narrow');break}
 case 'workflow':showWorkflow(id,true);break;case 'create-workflow':showWorkflow(null,true);break;case 'save-workflow':saveWorkflow();break;case 'flow-connections':showFlowConnections(id);break;
 case 'flow-add-node':readWorkflow();state.workflowDraft.nodes.push(defaultNode(uid('node'),'新审批节点',[]));showWorkflow();break;
 case 'flow-remove-node':readWorkflow();if(state.workflowDraft.nodes.length>1)state.workflowDraft.nodes=state.workflowDraft.nodes.filter(n=>n.id!==id);showWorkflow();break;
 case 'flow-move-node':{readWorkflow();const ns=state.workflowDraft.nodes,index=ns.findIndex(n=>n.id===id),next=index+Number(b.dataset.step);if(next>=0&&next<ns.length)[ns[index],ns[next]]=[ns[next],ns[index]];showWorkflow();break}
 case 'review':showReview(id);break;case 'decision':decide(id,b.dataset.decision);break;case 'export-events':exportEvents();break;
 case 'simulate-web-plugin':{const ok=canRunWebPlugin(state.persona,b.dataset.environment,id,b.dataset.plugin);toast(ok?'允许使用插件（仅演示，不执行真实扩展）':'禁止使用插件：环境功能授权、Web 访问权限或插件启用状态不足');if(state.detail)renderDetail();break}
 case 'simulate':{const channel=document.querySelector('#simulate-channel').value,operation=document.querySelector('#simulate-operation').value,ok=canExecute(state.persona,id,operation,channel);document.querySelector('#simulate-result').textContent=(ok?'允许':'禁止')+'：'+(channel==='manual'?'常规':channel.toUpperCase())+' · '+CAPABILITIES[connection(id).cap].actions[operation]+(ok?'（仅验证，不执行真实操作）':'（操作权限或目标功能授权不足）');break}
 case 'dependency-edit':{if(!can('credential.update'))break;const d=db.dependencies.find(d=>d.id===id);openModal('维护关联记录',d.name,`${field('名称',input('dependency-name',d.name,'记录名称'))}<p>引用关系不会授予其他连接的使用权。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-dependency" data-id="${id}">保存</button>`,'narrow');break}
 case 'save-dependency':{if(!can('credential.update'))break;const name=document.querySelector('#dependency-name').value.trim();if(!name){error('请输入名称');break}db.dependencies.find(d=>d.id===id).name=name;record('维护关联资源',name,'修改示例记录，未涉及私钥内容');afterSave('记录已保存');break}
 case 'tool':if(can(id))toast('已验证 '+permission(id).label+' 权限；原型不执行真实操作');break;
 }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.querySelector('#modal-root').innerHTML)closeModal();else if(state.detail)closeDetail();else if(state.sidebar){state.sidebar=false;render()}}if(event.key==='Tab'){const dialog=document.querySelector('#modal-root [role="dialog"]')||document.querySelector('#detail-root [role="dialog"]');if(!dialog)return;const items=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();

</script>
