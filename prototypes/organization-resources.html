function chips(perms,max=3){const list=Object.keys(perms);return`<div class="permission-chips">${list.slice(0,max).map(c=>`<span class="badge">${CAPS[c].label}</span>`).join('')}${list.length>max?`<span class="badge outline">+${list.length-max}</span>`:''}</div>`}
function validText(g){if(g.enabled===false)return '已停用';if(!activeGrant(g))return g.starts&&new Date(g.starts)>new Date()?'待生效':'已过期';return g.expires?new Date(g.expires).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})+' 到期':'永久有效'}

function hostSlug(e){return e.short.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function poolName(cap,index){return cap==='ssh'?['应用主节点','应用副节点','网关节点'][index]||'应用节点 '+(index+1):cap==='database'?['业务主库','只读副本'][index]||'数据库 '+(index+1):'业务缓存 '+(index+1)}
function ensureConnections(){
  if(!Array.isArray(db.connections)||!db.connections.length){
    const list=[];
    db.envs.forEach(e=>['ssh','database','redis'].forEach(cap=>{
      for(let i=0;i<(e.counts[cap]||0);i++){
        const slug=hostSlug(e);
        list.push({id:`${e.id}:${cap}-${i+1}`,cap,name:poolName(cap,i),meta:cap==='ssh'?`${slug}-${i+1}.example.com · SSH / SFTP`:cap==='database'?`${slug}-db.example.com · MySQL`:`${slug}-cache.example.com · Redis`,envs:[e.id]});
      }
    }));
    list.push(
      {id:'ssh-shared-edge',cap:'ssh',name:'统一出口网关',meta:'edge.example.com · SSH / SFTP',envs:['e1','e5']},
      {id:'ssh-unassigned-1',cap:'ssh',name:'办公跳板机',meta:'bastion.example.com · SSH / SFTP',envs:[]},
      {id:'ssh-unassigned-2',cap:'ssh',name:'历史账单主机',meta:'billing-old.example.com · SSH / SFTP',envs:[]},
      {id:'db-unassigned-1',cap:'database',name:'临时分析库',meta:'adhoc.example.com · MySQL',envs:[]},
      {id:'redis-unassigned-1',cap:'redis',name:'会话缓存',meta:'session.example.com · Redis',envs:[]}
    );
    db.connections=list;
  }
  db.envs.forEach(e=>['ssh','database','redis'].forEach(cap=>{e.counts[cap]=db.connections.filter(x=>x.cap===cap&&x.envs.includes(e.id)).length}));
}
function presentConnection(c){const o=db.resourceOverrides?.[c.id]||{};return {...c,name:o.name||c.name,meta:o.meta||c.meta}}
function grantCoversConnection(g,c){return !!(c.envs.length&&activeGrant(g)&&g.perms[c.cap]?.length&&(g.scopeAll||g.envs.some(id=>c.envs.includes(id)))&&(g.future!==false||(g.items?.[c.cap]||[]).includes(c.id)))}
function linkedToScope(c){const visible=new Set(scopedEnvs().map(e=>e.id));return c.envs.some(id=>visible.has(id))}
function personaSeesAllScopedEnvs(){const visible=new Set(scopedEnvs().map(e=>e.id));return db.envs.filter(e=>descendants(state.team).includes(e.team)).every(e=>visible.has(e.id))}
function insideConnections(cap){const list=db.connections.filter(c=>c.cap===cap);if(state.team==='root'&&personaSeesAllScopedEnvs())return list;if(state.team==='root')return list.filter(c=>!c.envs.length||linkedToScope(c));return list.filter(linkedToScope)}
function outsideConnections(cap){const list=db.connections.filter(c=>cap?c.cap===cap:(c.cap==='ssh'||c.cap==='database'||c.cap==='redis'));if(state.team==='root'&&personaSeesAllScopedEnvs())return cap?[]:list.filter(c=>!c.envs.length);if(state.team==='root')return list.filter(c=>(c.envs.length&&!linkedToScope(c))||(!cap&&!c.envs.length));return list.filter(c=>!linkedToScope(c))}
function connectionMatches(c,q){const item=presentConnection(c);return [item.name,item.meta,CAPS[c.cap].label,...c.envs.flatMap(id=>[env(id)?.name,env(id)?.short,team(env(id)?.team)?.name])].join(' ').toLowerCase().includes(q.toLowerCase())}
function envSummary(c){const linked=c.envs.map(id=>env(id)).filter(Boolean);if(!linked.length)return '<span class="badge quiet">未关联环境</span>';return linked.slice(0,2).map(e=>`<span style="display:block;font-size:11px">${esc(e.name)}</span>`).join('')+(linked.length>2?`<span class="cell-sub">另有 ${linked.length-2} 个环境</span>`:'')}
function teamSummary(c){const names=[...new Set(c.envs.map(id=>env(id)?.team).filter(Boolean))].map(id=>team(id)?.name).filter(Boolean);if(!names.length)return '<span class="cell-sub">未归属子组织</span>';return `<span style="display:block;font-size:11px">${names.map(esc).join('、')}</span>${names.length>1?'<span class="cell-sub" style="display:block">跨子组织</span>':''}`}
function userCanUseConnection(uid,c){const u=user(uid);return db.grants.some(g=>grantCoversConnection(g,c)&&appliesToUser(g,u))}
function connectionRow(c,mixed){const item=presentConnection(c),rules=db.grants.filter(g=>grantCoversConnection(g,c)),people=db.users.filter(u=>userCanUseConnection(u.id,c)).length,usable=userCanUseConnection(state.persona,c);return `<tr class="click-row" data-action="connection" data-id="${c.id}" tabindex="0" aria-label="查看${esc(item.name)}"><td><div class="env-identity"><span class="env-icon">${icon(CAPS[c.cap].icon)}</span><div><span class="cell-title">${esc(item.name)}${mixed?` <span class="badge outline">${CAPS[c.cap].label}</span>`:''}</span><span class="cell-sub mono">${esc(item.meta)}</span></div></div></td><td>${envSummary(c)}</td><td>${teamSummary(c)}</td><td><div class="access-count">${icon('shield')} ${rules.length} 条规则</div><span class="cell-sub">${people} 人可使用</span></td><td><span class="badge ${usable?'green':'outline'}">${usable?'可使用':'未授权'}</span></td><td><button class="icon-btn" data-action="connection" data-id="${c.id}" aria-label="查看${esc(item.name)}详情">${icon('right')}</button></td></tr>`}
function renderOutside(rows,mixed){const q=state.search.trim();const matched=q?rows.filter(c=>connectionMatches(c,q)):rows;if(!rows.length||(q&&!matched.length))return '';const open=state.showUnowned,shown=q?matched:rows,onlyUnassigned=rows.every(c=>!c.envs.length);const title=onlyUnassigned?'未关联环境的连接':'未拥有的连接';const hint=q&&!open?`有 ${matched.length} 条匹配，展开后查看`:onlyUnassigned?'这些连接只在工作台中，尚未归入任何环境':state.team==='root'?'当前身份看不到这些连接所属的环境，展开后查看名称和地址':`不在${selected().name}的管理范围内，展开后查看名称和地址`;return `<section class="unowned"><button type="button" class="unowned-toggle" data-action="toggle-unowned" aria-expanded="${open?'true':'false'}"><span class="chev">${icon(open?'down':'right')}</span><span class="grow"><strong>${title}</strong><small>${esc(hint)}</small></span><span class="count">${shown.length}</span></button>${open?`<div class="table-scroll"><table class="connection-table"><thead><tr><th style="width:32%">连接</th><th>关联环境</th><th>管理归属</th><th>使用授权</th><th>当前身份</th><th></th></tr></thead><tbody>${shown.map(c=>connectionRow(c,mixed)).join('')}</tbody></table></div>`:''}</section>`}
function lensBar(){const items=[['environment','环境 / 环境组',scopedEnvs().length],['ssh','SSH 工作台',insideConnections('ssh').length],['database','数据库工作台',insideConnections('database').length],['redis','Redis 工作台',insideConnections('redis').length]];return `<nav class="lens" aria-label="资源视角">${items.map(([id,label,n])=>`<button type="button" data-action="lens" data-id="${id}" class="${state.lens===id?'active':''}" aria-current="${state.lens===id?'true':'false'}">${label}<span class="count">${n}</span></button>`).join('')}</nav>`}
function environmentRow(e){const gs=db.grants.filter(g=>(g.scopeAll||g.envs.includes(e.id))&&activeGrant(g));return `<tr class="click-row" data-action="environment" data-id="${e.id}" tabindex="0" aria-label="查看${esc(e.name)}"><td><div class="env-identity"><span class="env-icon ${e.group}">${icon('layers')}</span><div><span class="cell-title">${esc(e.name)}</span><span class="cell-sub mono">${esc(e.short)}</span><div class="resource-strip" title="已关联的 Web / SSH / 数据库 / Redis / 日志">${['web','ssh','database','redis','logs'].map(c=>`<span>${icon(CAPS[c].icon)}${e.counts[c]}</span>`).join('')}</div></div></div></td><td><span class="flex" style="gap:6px;font-size:11px">${icon('tree')} ${esc(team(e.team).name)}</span><span class="cell-sub">${esc(team(team(e.team).parent)?.name||'组织直属')}</span></td><td><div class="identity">${avatar(user(e.owner))}<span>${esc(user(e.owner).name)}</span></div></td><td><div class="access-count">${icon('shield')} ${gs.length} 条规则</div><span class="cell-sub">${new Set(db.users.filter(u=>gs.some(g=>appliesToUser(g,u))).map(u=>u.id)).size} 人可使用</span></td><td><span class="badge ${e.status==='maintenance'?'amber':'green'}"><i class="dot"></i>${e.status==='maintenance'?'维护中':'正常'}</span></td><td><button class="icon-btn" data-action="environment" data-id="${e.id}" aria-label="查看${esc(e.name)}详情">${icon('right')}</button></td></tr>`}
function renderEnvironmentLens(){const q=state.search.toLowerCase();const list=scopedEnvs().filter(e=>(state.filter==='all'||e.group===state.filter)&&[e.name,e.short,team(e.team).name].join(' ').toLowerCase().includes(q));const groups=state.filter==='all'?['production','staging','development']:[state.filter];const body=list.length?groups.map(g=>{const rows=list.filter(e=>e.group===g);return rows.length?`<tr class="group-row"><td colspan="6">${esc(TYPES[g])}环境组<span class="count">${rows.length}</span></td></tr>${rows.map(environmentRow).join('')}`:''}).join(''):`<tr><td colspan="6"><div class="empty">${icon('layers')}<strong>没有匹配的环境</strong>尝试调整分组或搜索条件。</div></td></tr>`;return `${lensBar()}<div class="toolbar"><div class="segmented" aria-label="环境分组">${[['all','全部环境'],['production','生产'],['staging','测试'],['development','开发']].map(([id,n])=>`<button type="button" data-action="filter" data-id="${id}" class="${state.filter===id?'active':''}">${n}</button>`).join('')}</div><div class="spacer"></div><label class="search">${icon('search')}<input id="search" type="search" placeholder="搜索环境或所属子组织" value="${esc(state.search)}" aria-label="搜索环境"></label><button class="btn" data-action="create-env" ${!canCreateEnvironment()?'disabled':''}>${icon('plus')}新建环境</button></div><section class="panel"><div class="table-scroll"><table class="environment-table"><thead><tr><th style="width:34%">环境 / 已关联资源</th><th>管理归属</th><th>负责人</th><th>使用授权</th><th>状态</th><th></th></tr></thead><tbody>${body}</tbody></table></div><div class="table-footer"><span>共 ${list.length} 个环境 · ${state.team==='root'?'组织内已关联资源':esc(selected().name)+'及下级的管理范围'}</span><div class="pagination">每页 20 条 <span class="current-page">1</span><button disabled aria-label="下一页">${icon('right')}</button></div></div></section>${renderOutside(outsideConnections(),true)}`}
function renderConnectionLens(cap){const q=state.search.trim();const list=insideConnections(cap).filter(c=>!q||connectionMatches(c,q));const outside=outsideConnections(cap);const label=CAPS[cap].label;const emptyDetail=q?(outside.length?'试试其他关键词，或展开下方查看匹配的连接。':'试试其他关键词。'):'当前范围内没有已关联的连接。';return `${lensBar()}<div class="toolbar"><span style="font-size:12px;color:#778d70">${label} 连接可以关联多个环境，也可以先留在工作台</span><div class="spacer"></div><label class="search">${icon('search')}<input id="search" type="search" placeholder="搜索连接、地址或环境" value="${esc(state.search)}" aria-label="搜索${label}连接"></label></div><section class="panel"><div class="table-scroll"><table class="connection-table"><thead><tr><th style="width:32%">连接</th><th>关联环境</th><th>管理归属</th><th>使用授权</th><th>当前身份</th><th></th></tr></thead><tbody>${list.map(c=>connectionRow(c,false)).join('')||`<tr><td colspan="6"><div class="empty">${icon(CAPS[cap].icon)}<strong>没有匹配的${label}连接</strong>${emptyDetail}</div></td></tr>`}</tbody></table></div><div class="table-footer"><span>共 ${list.length} 条 ${label} 连接 · ${state.team==='root'?'包含尚未关联环境的工作台连接':esc(selected().name)+'管理范围内已关联的连接'}</span></div></section>${renderOutside(outside,false)}`}
function renderEnvironments(){const lens=state.lens||'environment';const view=lens==='environment'?renderEnvironmentLens():renderConnectionLens(lens);return `${view}<div class="insight-strip"><div class="insight-item">${icon('layers')}<div><strong>环境 / 环境组</strong><p>这里汇总已经关联到环境的资源，并按环境组归在一起。</p></div></div><div class="insight-item">${icon('terminal')}<div><strong>工作台连接</strong><p>SSH、数据库、Redis 可以不关联环境，也可以关联多个环境。</p></div></div><div class="insight-item">${icon('right')}<div><strong>范围外默认折叠</strong><p>未拥有的连接展开后才显示名称和地址。</p></div></div></div><div class="hint-bottom">${icon('info')}环境视角只列出已关联资源。工作台视角单独查看连接；当前范围没有的连接收在列表下方。</div>`}
function renderConnectionDetail(id){const raw=db.connections.find(x=>x.id===id);if(!raw)return {title:'连接',sub:'',body:'<div class="detail-empty">找不到这条连接。</div>'};const c=presentConnection(raw),linked=c.envs.map(eid=>env(eid)).filter(Boolean),usable=userCanUseConnection(state.persona,raw),gs=db.grants.filter(g=>grantCoversConnection(g,raw));const notice=!linked.length?`<div class="notice" style="margin-bottom:18px">${icon('info')}<span>这条连接只存在于 ${CAPS[c.cap].label} 工作台，还没有关联环境，因此不会出现在环境列表中。</span></div>`:!linkedToScope(raw)?`<div class="notice" style="margin-bottom:18px">${icon('info')}<span>${esc(selected().name)}不负责这条连接的管理归属。查看名称和地址不会改变使用权限。</span></div>`:'';return {title:c.name,sub:`${CAPS[c.cap].label} · ${linked.length?linked.map(e=>e.name).join('、'):'未关联环境'}`,body:`${notice}<dl class="detail-facts"><div><dt>连接地址</dt><dd class="mono">${esc(c.meta)}</dd></div><div><dt>当前身份</dt><dd>${usable?'可使用':'未授权'}</dd></div><div><dt>管理归属</dt><dd>${teamSummary(c)}</dd></div><div><dt>关联环境</dt><dd>${linked.length?linked.length+' 个':'无'}</dd></div></dl><div class="management-card"><h3>关联环境</h3>${linked.map(e=>`<div class="resource-item"><div class="grow"><strong>${esc(e.name)}</strong><p>${esc(team(e.team).name)} · ${TYPES[e.group]}环境</p></div><button class="text-btn" data-action="environment" data-id="${e.id}">查看环境 ${icon('right')}</button></div>`).join('')||'<p>还没有关联环境。</p>'}</div><div class="section-head"><h3>覆盖这条连接的授权</h3></div>${gs.map(accessCard).join('')||'<div class="detail-empty">还没有授权规则覆盖这条连接。</div>'}`}}
function renderMembers(){let list=scopedUsers().filter(u=>[u.name,u.title].join(' ').includes(state.search));return`<div class="toolbar"><div class="segmented"><button class="active">组织成员</button><button data-action="invitations">邀请记录 <span class="count">${db.invitations.length}</span></button></div><div class="spacer"></div><label class="search">${icon('search')}<input id="search" type="search" value="${esc(state.search)}" placeholder="搜索姓名或职责" aria-label="搜索成员"></label><button class="btn" data-action="assign-role" ${!can('role.assign')?'disabled':''}>${icon('user')}分配管理角色</button></div><section class="panel"><div class="table-scroll"><table style="min-width:720px"><thead><tr><th>成员</th><th>所属子组织</th><th>管理角色 / 范围</th><th>可用环境</th><th>状态</th><th></th></tr></thead><tbody>${list.map(u=>`<tr><td><div class="identity">${avatar(u)}<div><strong>${esc(u.name)}</strong><small>${esc(u.title)}</small></div></div></td><td><div class="role-tags">${u.teams.map(id=>`<span class="badge outline">${esc(team(id).name)}</span>`).join('')}</div></td><td><div class="stack">${u.roles.map(r=>`<span style="font-size:11px">${esc(roleById(r.id)?.name||'未分配')}<small> · ${esc(scopeLabel(r.scope))}</small></span>`).join('')}</div></td><td><span class="count">${db.envs.filter(e=>effective(u.id,e.id).length).length} 个环境</span></td><td><span class="badge green"><i class="dot"></i>已激活</span></td><td><button class="text-btn" data-action="member" data-id="${u.id}">查看权限 ${icon('right')}</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty"><strong>没有匹配的成员</strong></div></td></tr>'}</tbody></table></div><div class="table-footer"><span>共 ${list.length} 名成员 · 同一成员可加入多个子组织</span><span>管理角色与资源使用授权分别计算</span></div></section>`}

function renderGrants(){let list=scopedGrants().filter(g=>[g.name,subjectName(g),...g.envs.map(id=>env(id)?.name)].join(' ').includes(state.search));return`<div class="toolbar"><span style="font-size:12px;color:#778d70">统一查看授权对象、资源范围与有效期</span><div class="spacer"></div><label class="search">${icon('search')}<input id="search" value="${esc(state.search)}" type="search" placeholder="搜索规则、成员或环境" aria-label="搜索授权规则"></label><button class="btn primary" data-action="grant" ${!canAuthorize()?'disabled':''}>${icon('plus')}新建授权</button></div><section class="panel"><div class="table-scroll"><table style="min-width:810px"><thead><tr><th>授权规则</th><th>授权对象</th><th>环境范围</th><th>权限</th><th>有效期</th><th></th></tr></thead><tbody>${list.map(g=>`<tr><td><span class="cell-title">${esc(g.name)}</span><span class="grant-source ${grantInherited(g)?'inherited':''}">${grantInherited(g)?'继承自 '+esc(subjectName(g)):g.source==='request'?'申请审批':'管理员主动授权'}</span></td><td><div class="flex" style="gap:7px"><span class="subject-icon">${icon(g.subjectType==='team'?'tree':'user')}</span><span style="font-size:11px">${esc(subjectName(g))}</span></div><span class="cell-sub">${g.subjectType==='team'?'包含下级成员':'个人直接授权'}</span></td><td><span style="font-size:11px">${g.envs.length===1?esc(env(g.envs[0])?.name):g.envs.length+' 个环境'}</span><small style="display:block">${g.future?'包含环境内新增资源':'仅限指定资源'}</small></td><td>${chips(g.perms,2)}</td><td><span class="badge ${g.expires?'amber':'outline'}">${validText(g)}</span></td><td><div class="row-actions"><button class="text-btn" data-action="grant-detail" data-id="${g.id}">详情</button><button class="text-btn" data-action="edit-grant" data-id="${g.id}" ${!canAuthorize(g.envs,'authorization.update')?'disabled':''}>修改</button><button class="text-btn" data-action="toggle-grant" data-id="${g.id}" ${!canAuthorize(g.envs,'authorization.update')?'disabled':''}>${g.enabled===false?'启用':'停用'}</button><button class="icon-btn" data-action="clone-grant" data-id="${g.id}" aria-label="复制授权规则" ${!canAuthorize(g.envs)?'disabled':''}>${icon('copy')}</button></div></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty"><strong>没有匹配的授权规则</strong></div></td></tr>'}</tbody></table></div><div class="table-footer"><span>共 ${list.length} 条规则 · 有效权限取所有生效授权的并集</span><span>子组织成员继承本级及上级授权</span></div></section><div class="hint-bottom">${icon('shield')}移除单条规则后，其他直接授权或继承权限仍可能有效。</div>`}

function renderReviews(){const rs=relevantRequests(),pending=rs.filter(r=>r.status==='pending').length;return`<div class="toolbar"><div class="segmented"><button class="${state.reviewTab==='requests'?'active':''}" data-action="review-tab" data-id="requests">授权申请</button><button class="${state.reviewTab==='history'?'active':''}" data-action="review-tab" data-id="history">授权台账</button></div><div class="spacer"></div><button class="btn" data-action="workflow" ${!can('approval.workflow')?'disabled':''}>${icon('settings')}审批流程</button><button class="btn primary" data-action="request" ${!can('authorization.request')?'disabled':''}>${icon('plus')}申请权限</button></div>${state.reviewTab==='requests'?`<section class="panel"><div class="review-summary"><div><strong>${pending.toString().padStart(2,'0')}</strong><span>待审批</span></div><div><strong>${rs.filter(r=>r.status==='approved').length.toString().padStart(2,'0')}</strong><span>已通过</span></div><div class="spacer"></div><span>${icon('tree')} 团队负责人 → 授权管理员</span></div><div class="table-scroll"><table style="min-width:750px"><thead><tr><th>申请 / 用途</th><th>申请人</th><th>权限 / 时长</th><th>当前节点</th><th>状态</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><span class="cell-title">${esc(r.name)}</span><span class="cell-sub">${esc(env(r.env)?.name)}</span></td><td><div class="identity">${avatar(user(r.user))}<span>${esc(user(r.user).name)}</span></div></td><td><div class="stack">${chips(r.perms,2)}<span class="cell-sub">${esc(r.duration)} · ${esc(r.account)}</span></div></td><td><span style="font-size:11px">${r.status==='pending'?(r.stage===0?'团队负责人确认':'授权管理员审核'):r.status==='approved'?'授权已生效':'流转已结束'}</span><small style="display:block">${esc(r.created)}</small></td><td><span class="badge ${r.status==='pending'?'amber':r.status==='approved'?'green':'outline'}">${({pending:'待审批',approved:'已通过',rejected:'已拒绝',withdrawn:'已撤回'})[r.status]}</span></td><td><button class="text-btn" data-action="review" data-id="${r.id}">查看申请</button></td></tr> function openDetail(type,id,tab){state.focusReturn=document.activeElement;state.detail={type,id};state.detailTab=tab||(type==='environment'?'resources':'access');renderDetail();document.querySelector('#detail-root .icon-btn')?.focus();document.body.style.overflow='hidden'}

function renderDetail(){if(!state.detail)return;const{type,id}=state.detail;
 let title='',sub='',body='',tabs=[];
 if(type==='environment'){const e=env(id);title=e.name;sub=`${team(e.team).name} / ${TYPES[e.group]}环境`;tabs=[['resources','环境资源'],['access','谁可以使用'],['management','管理归属']];
 if(state.detailTab==='resources')body=`<dl class="detail-facts"><div><dt>环境组</dt><dd>${TYPES[e.group]}环境</dd></div><div><dt>负责人</dt><dd>${user(e.owner).name}</dd></div></dl>${Object.entries(CAPS).map(([c,cap])=>`<section class="resource-family"><div class="family-heading">${icon(cap.icon)}<h3>${cap.label}</h3><span class="count">${e.counts[c]}</span></div>${resourcesFor(e,c).map(r=>`<div class="resource-item"><div class="grow"><strong>${esc(r.name)}</strong><p><code>${esc(r.meta)}</code></p></div><span class="badge outline">${c==='ssh'?'2 个账号':c==='database'?'读写 / 只读账号':c==='knowledge'?'组织文档':'可授权'}</span>${can('resource.'+c+'.configure',id)?`<button class="text-btn" data-action="configure-resource" data-env="${id}" data-cap="${c}" data-id="${r.id}">配置</button>`:''}</div>`).join('')||'<small>暂无此类资源</small>'}</section>`).join('')}`;
 if(state.detailTab==='access'){const gs=db.grants.filter(g=>g.scopeAll||g.envs.includes(id));body=`<div class="notice" style="margin-bottom:20px">${icon('shield')}<span>管理归属与使用授权分别展示。使用权限由生效授权规则计算，管理角色与管理归属独立配置。</span></div>${gs.map(g=>accessCard(g)).join('')||'<div class="detail-empty">还没有使用授权。</div>'}`}
 if(state.detailTab==='management')body=`<div class="management-card"><h3>${icon('tree')} 管理归属</h3><p>由 ${team(e.team).name} 负责环境配置与资源维护。其他团队通过授权使用资源。</p><dl><dt>所属子组织</dt><dd>${team(e.team).name}</dd><dt>环境负责人</dt><dd>${user(e.owner).name}</dd><dt>子组织负责人</dt><dd>${user(team(e.team).manager)?.name}</dd></dl></div><div class="management-card"><h3>具备管理职责的成员</h3>${db.users.filter(u=>can('environment.update',e.id,u)||Object.keys(CAPS).some(c=>can('resource.'+c+'.configure',e.id,u))).map(u=>`<div class="resource-item"><div class="identity grow">${avatar(u)}<div><strong>${u.name}</strong><p>${u.roles.filter(b=>bindingCovers(b,e.id)&&roleById(b.id)?.enabled).map(b=>esc(roleById(b.id).name)).join('、')}</p></div></div></div>`).join('')}</div><div class="notice">${icon('info')}维护环境的管理角色不会自动提供 SSH 登录或数据读写权限。组织负责人的原有使用权限通过独立规则保留。</div>`;
 }else if(type==='member'){const u=user(id);title=u.name;sub=u.title+' · '+u.teams.map(t=>team(t).name).join(' / ');tabs=[['access','可使用的资源'],['management','管理职责']];
 if(state.detailTab==='access'){const isAdmin=false;body='';body+=db.envs.filter(e=>isAdmin||effective(id,e.id).length).map(e=>{const gs=effective(id,e.id),p=isAdmin?Object.fromEntries(Object.entries(CAPS).map(([c,x])=>[c,Object.keys(x.actions)])):unionPermissions(gs);return`<div class="access-card"><div class="between"><strong>${e.name}</strong><span class="badge green">${Object.keys(p).length} 类资源</span></div><p>${esc(permText(p))}</p>${isAdmin?'<div class="flow-path">组织管理员 → 全部权限</div>':gs.map(g=>`<div class="flow-path">${g.subjectType==='user'?`${icon('user')}个人直授`:`${icon('tree')}${esc(team(g.subject).name)}${icon('arrow')}${esc(u.teams.find(t=>ancestors(t).includes(g.subject))?team(u.teams.find(t=>ancestors(t).includes(g.subject))).name:'')}`}${icon('arrow')}${esc(u.name)}<span class="spacer"></span><span>${g.expires?'限时':'永久'}</span></div>`).join('')}</div>`}).join('')||'<div class="detail-empty">暂无资源使用权限，可提交授权申请。</div>'}
 if(state.detailTab==='management')body=u.roles.map(r=>`<div class="management-card"><h3>${esc(roleById(r.id)?.name||'未分配')}</h3><p>${esc(roleById(r.id)?.desc||'')}</p><dl><dt>绑定范围</dt><dd>${esc(scopeLabel(r.scope))}</dd><dt>角色状态</dt><dd>${roleById(r.id)?.enabled?'已启用':'已停用'}</dd><dt>权限码</dt><dd>${roleById(r.id)?.permissions.length||0} 项</dd><dt>生效范围</dt><dd>${r.scope==='root'?'整个组织':team(r.scope)?(r.includeChildren?'本级及下级子组织':'仅本级子组织'):'仅绑定资源范围'}</dd></dl></div>`).join('');
 }else if(type==='connection'){const detail=renderConnectionDetail(id);title=detail.title;sub=detail.sub;body=detail.body;tabs=[];}else{const g=db.grants.find(x=>x.id===id);title=g.name;sub='授权规则 · '+subjectName(g);tabs=[];body=`<dl class="detail-facts"><div><dt>授权对象</dt><dd>${subjectName(g)}</dd></div><div><dt>有效期</dt><dd>${validText(g)}</dd></div><div><dt>登录账号</dt><dd>${esc(g.account)}</dd></div><div><dt>来源</dt><dd>${g.source==='request'?'申请审批':'管理员主动授权'}</dd></div></dl><div class="management-card"><h3>环境范围</h3><p>${g.envs.map(e=>esc(env(e)?.name)).join('、')}</p></div><div class="management-card"><h3>操作权限</h3><p>${esc(permText(g.perms))}</p>${!g.future?`<p>对象范围：${Object.entries(g.perms).map(([c])=>CAPS[c].label+' '+((g.items?.[c]||[]).map(r=>(env(r.split(':')[0])?.name||'')+' · '+(g.envs.flatMap(id=>resourcesFor(env(id),c)).find(x=>x.id===r)?.name||r)).join('、')||'未选择')).join('；')}</p>`:''}</div><div class="management-card"><h3>授权原因</h3><p>${esc(g.reason)}</p></div>${g.subjectType==='team'?`<div class="inherited-explanation">授权 ${subjectName(g)} 时，其直属成员及下级子组织成员均继承对应使用权限。</div>`:''}`}
 document.querySelector('#detail-root').innerHTML=`<div class="overlay" data-action="close-detail"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="drawer-head"><div class="between"><span class="eyebrow" style="margin:0">${type==='environment'?'ENVIRONMENT':type==='member'?'MEMBER ACCESS':type==='connection'?'CONNECTION':'AUTHORIZATION'}</span><button class="icon-btn" data-action="close-detail" aria-label="关闭详情">${icon('close')}</button></div><h2>${esc(title)}</h2><p>${esc(sub)}</p></header>${tabs.length?`<nav class="drawer-tabs">${tabs.map(([k,n])=>`<button class="tab ${state.detailTab===k?'active':''}" data-action="detail-tab" data-id="${k}">${n}</button>`).join('')}</nav>`:''}<div class="drawer-body">${body}</div><footer class="drawer-footer">${type==='environment'&&canManageEnv(env(id))?`<button class="btn" data-action="edit-env" data-id="${id}">${icon('edit')}编辑环境</button>`:''}${type==='environment'&&canAuthorize([id])?`<button class="btn primary" data-action="grant" data-env="${id}">${icon('plus')}授权资源</button>`:''}${type==='grant'&&(canAuthorize(db.grants.find(g=>g.id===id).envs,'authorization.revoke')||canAuthorize(db.grants.find(g=>g.id===id).envs,'authorization.update'))?`<button class="btn danger" data-action="revoke" data-id="${id}" ${!canAuthorize(db.grants.find(g=>g.id===id).envs,'authorization.revoke')?'disabled':''}>撤销授权</button><button class="btn primary" data-action="edit-grant" data-id="${id}" ${!canAuthorize(db.grants.find(g=>g.id===id).envs,'authorization.update')?'disabled':''}>修改规则</button>`:''}<button class="btn" data-action="close-detail">关闭</button></footer></aside></div>`;
}
function accessCard(g){const who=subjectName(g);return`<div class="access-card"><div class="between"><div class="flex"><span class="subject-icon">${icon(g.subjectType==='team'?'tree':'user')}</span><strong>${esc(who)}</strong></div><span class="badge ${activeGrant(g)?'green':'outline'}">${activeGrant(g)?'生效中':'未生效'}</span></div><p>${esc(permText(g.perms))}</p><div class="foot">${icon('key')}${esc(g.account)}<span class="spacer"></span>${validText(g)}</div><div class="flow-path">${icon('shield')}${esc(g.name)}<span class="spacer"></span><button class="text-btn" data-action="grant-detail" data-id="${g.id}">详情</button></div></div>`}
function openModal(title,subtitle,body,footer,width=''){state.focusReturn=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="modal-wrap" data-action="close-modal"><section class="modal ${width}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-header"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-footer"><span id="form-error" class="form-error" role="alert"></span>${footer||'<button class="btn" data-action="close-modal">关闭</button>'}</footer></section></div>`;document.body.style.overflow='hidden';document.querySelector('#modal-root .icon-btn')?.focus()}
function closeModal(){document.querySelector('#modal-root').innerHTML='';if(!state.detail)document.body.style.overflow='';state.focusReturn?.isConnected&&state.focusReturn.focus()}
function field(label,html,full=''){return`<div class="field ${full}"><label>${label}</label>${html}</div>`}
function input(id,value='',placeholder=''){return`<input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder||id)}">`}
function selectHTML(id,options,value){return`<select id="${id}" aria-label="${id}">${options.map(([v,n])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function error(msg){document.querySelector('#form-error').textContent=msg}
function showNotes(){openModal('组织、子组织与环境：设计说明','以 Viron 现有资源体系为基础，借鉴 JumpServer 的职责划分。',`<p class="notes-intro">根组织提供统一工作空间。子组织继续承担人员分组与上级权限继承，并可绑定管理职责；环境保留业务资源集合的定位。管理范围与使用授权分别配置。内置角色与自定义角色共用权限码目录，角色名称不参与权限判断。</p><div class="model-map"><div class="model-node"><strong>组织 / 子组织</strong><p>成员、层级、团队职责</p></div><div class="model-node"><strong>环境 / 环境组</strong><p>管理归属、七类业务资源</p></div><div class="model-node"><strong>授权规则</strong><p>谁能使用、操作范围、有效期</p></div></div><div class="notes-grid"><div><h3>沿用 Viron 现有能力</h3><ul><li>组织工作空间与多级子组织</li><li>成员可加入多个子组织</li><li>个人直授与上级授权取并集</li><li>七类资源的细粒度操作授权</li><li>开始 / 结束时间与审批台账</li></ul></div><div><h3>本原型探索的调整</h3><ul><li>环境设置明确的管理子组织</li><li>内置角色作为模板，自定义角色勾选权限码</li><li>角色分配绑定范围与授权委派上限</li><li>授权与审计职责可分别分配</li><li>统一授权列表与双向权限查看</li><li>登录账号、SFTP 动作、指定资源</li><li>SSH、数据库、Redis 连接可独立于环境，按工作台查看</li><li>当前范围未拥有的连接默认折叠</li><li>组织架构上方查看自己在当前组织的授权、申请和审批</li></ul></div></div><div class="notice" style="margin-top:22px">${icon('info')}这是单文件参考原型，使用虚构数据。操作保存在本浏览器；可从左下角设置恢复示例。权限码目录、范围角色与管理归属是本次设计方案，尚未接入 Viron 后端。</div><div class="notes-sources">设计参考：<a href="https://docs.fit2cloud.com/jumpserver/manual/common/organization_switch/" target="_blank" rel="noopener noreferrer">JumpServer 组织</a><a href="https://docs.fit2cloud.com/jumpserver/manual/admin/system_settings/role_list/" target="_blank" rel="noopener noreferrer">管理角色</a><a href="https://docs.fit2cloud.com/jumpserver/manual/admin/console/authorization_manage/assets_authorization/" target="_blank" rel="noopener noreferrer">资产授权</a></div>`)}
function showTeam(){if(!canManageTeam())return;openModal('新建子组织','子组织共享根组织的工作空间，可继承上级资源授权。',`<div class="form-grid">${field('子组织名称',input('team-name','','例如：支付研发'),'full')}${field('上级组织',selectHTML('team-parent',db.teams.filter(t=>canManageTeam(t.id)).map(t=>[t.id,t.name]),state.team),'full')}${field('团队负责人',selectHTML('team-manager',db.users.map(u=>[u.id,u.name]),current().id),'full')}${field('职责说明','<textarea id="team-description" aria-label="职责说明" placeholder="说明团队负责的业务与资源"></textarea>','full')}</div><div class="notice">${icon('tree')}创建后可分配成员与管理角色，再关联环境。负责人信息本身不会自动产生权限。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-team">创建子组织</button>`,'narrow')}
function saveTeam(){const name=document.querySelector('#team-name').value.trim(),parent=document.querySelector('#team-parent').value;if(!name)return error('请输入子组织名称');if(db.teams.some(t=>t.parent===parent&&t.name===name))return error('同级子组织名称已存在');const id='t'+Date.now();db.teams.push({id,name,parent,manager:document.querySelector('#team-manager').value,description:document.querySelector('#team-description').value.trim()||'暂无职责说明。'});state.team=id;state.tab='environments';state.search='';state.filter='all';record('创建子组织',name,'新建于 '+team(parent).name+'，尚未分配成员与环境。');persist();closeModal();render();toast('子组织已创建，可继续邀请成员或关联环境')}
function showEnvironment(id){const e=id?env(id):null;if(e?!canManageEnv(e):!canCreateEnvironment())return;openModal(e?'编辑环境':'新建环境','环境聚合业务资源；管理归属与使用授权分别配置。',`<div class="form-grid">${field('环境名称',input('env-name',e?.name||'','例如：支付服务 · 生产'),'full')}${field('环境组',selectHTML('env-group',Object.entries(TYPES),e?.group||'production').replace('<select ',e&&!can('environment.owner',e.id)?'<select disabled ':'<select '))}${field('管理归属',selectHTML('env-team',db.teams.filter(t=>e?(can('environment.owner',e.id)||e.team===t.id):canCreateEnvironment(t.id)).map(t=>[t.id,t.name]),e?.team||state.team))}${field('环境负责人',selectHTML('env-owner',db.users.map(u=>[u.id,u.name]),e?.owner||current().id))}${field('运行状态',selectHTML('env-status',[['active','正常'],['maintenance','维护中']],e?.status||'active'))}${field('环境说明',`<textarea id="env-description" aria-label="环境说明">${esc(e?.desc||'')}</textarea>`,'full')}</div><div class="notice">${icon('shield')}环境创建后可添加 Web、SSH、数据库、Redis、日志、知识库和服务维护资源，再单独配置使用授权。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-env" data-id="${id||''}">${e?'保存修改':'创建环境'}</button>`,'narrow')}
function saveEnvironment(id){if(id?!canManageEnv(env(id)):!canCreateEnvironment())return error('没有维护该环境的权限');const name=document.querySelector('#env-name').value.trim();if(!name)return error('请输入环境名称');const group=document.querySelector('#env-group').value,tid=document.querySelector('#env-team').value;if(id&&(tid!==env(id).team||group!==env(id).group)&&!can('environment.owner',id))return error('没有变更管理归属的权限');const data={name,group,team:tid,owner:document.querySelector('#env-owner').value,status:document.querySelector('#env-status').value,desc:document.querySelector('#env-description').value.trim()};if(id)Object.assign(env(id),data);else{id='e'+Date.now();db.envs.push({id,...data,short:'NEW / '+group.toUpperCase(),counts:Object.fromEntries(Object.keys(CAPS).map(k=>[k,0]))});db.grants.filter(g=>g.scopeAll).forEach(g=>g.envs.push(id))}record('更新环境',name,'管理归属：'+team(tid).name+'；负责人：'+user(data.owner).name);persist();closeModal();render();if(state.detail)renderDetail();else openDetail('environment',id);toast('环境已保存')}
function roleById(id){return db.roles.find(r=>r.id===id)}
function permissionByCode(code){return PERMISSION_CODES.find(p=>p.code===code)}
function scopeLabel(scope){return scope==='root'?'整个组织':scope.startsWith('group:')?TYPES[scope.slice(6)]+'环境组':team(scope)?.name||env(scope)?.name||scope}
function bindingCovers(binding,target){if(binding.scope==='root')return true;const e=env(target);if(binding.scope.startsWith('group:'))return Boolean(e&&e.group===binding.scope.slice(6));if(env(binding.scope))return binding.scope===target;const tid=e?.team||target;return binding.includeChildren===false?tid===binding.scope:ancestors(tid).includes(binding.scope)}
function permissionBindings(code,target='root',u=current()){return u.roles.filter(b=>{const r=roleById(b.id);return r?.enabled&&r.permissions.includes(code)&&(permissionByCode(code)?.scope==='personal'||bindingCovers(b,target))})}
function can(code,target='root',u=current()){return permissionBindings(code,target,u).length>0}
function canManageTeam(id=state.team){return can('team.create',id)}
function canInviteTeam(id=state.team){return can('member.invite',id)}
function canCreateEnvironment(id=state.team){return can('environment.create',id)}
function canManageEnv(e){return Boolean(e&&can('environment.update',e.id))}
function canAuthorize(eids=scopedEnvs().map(e=>e.id),code='authorization.create'){return eids.length>0&&eids.every(id=>can(code,id))}
function canSeeEnv(u,e){return can('environment.view',e.id,u)||effective(u.id,e.id).length>0}
function scopedEnvs(){return db.envs.filter(e=>descendants(state.team).includes(e.team)&&canSeeEnv(current(),e))}
function assignmentScopeOptions(r){const limits=r.permissions.map(c=>permissionByCode(c)?.scope);if(limits.includes('org'))return[['root','整个组织']];let options=[['root','整个组织'],...db.teams.filter(t=>t.id!=='root').map(t=>[t.id,'子组织 · '+t.name])];if(!limits.includes('team'))options.push(...Object.entries(TYPES).map(([k,v])=>['group:'+k,'环境组 · '+v]),...db.envs.map(e=>[e.id,'环境 · '+e.name]));return options}
function grantCeiling(binding){return binding.delegation||{perms:grantDefaults('manage'),maxHours:null}}
function withinDelegation(eids,perms,starts,expires,code='authorization.create'){const hours=expires?(new Date(expires)-new Date(starts||Date.now()))/3600000:Infinity;return eids.every(eid=>permissionBindings(code,eid).some(b=>{const d=grantCeiling(b);return(d.maxHours===null||hours<=d.maxHours+.001)&&Object.entries(perms).every(([c,actions])=>actions.every(a=>d.perms[c]?.includes(a)))}))}
function roleAssignments(rid){return db.users.flatMap(u=>u.roles.filter(b=>b.id===rid).map(b=>({u,b})))}
function roleScopeDescription(r){return r.permissions.some(c=>permissionByCode(c)?.scope==='org')?'组织级':r.permissions.some(c=>permissionByCode(c)?.scope==='team')?'组织 / 子组织':'组织 / 子组织 / 环境组 / 环境'}
function renderRoles(){const available=can('role.view')?db.roles:db.roles.filter(r=>current().roles.some(b=>b.id===r.id));let r=available.find(x=>x.id===state.role)||available[0];if(!r)return'<div class="empty"><strong>尚未分配角色</strong>可通过资源授权使用已有资源。</div>';state.role=r.id;const assignments=roleAssignments(r.id),codes=r.permissions.map(permissionByCode).filter(Boolean);return`
<div class="role-summary"><div><span class="eyebrow">ROLE CATALOG</span><h2>角色由权限码定义</h2><p>内置角色提供常用模板，自定义角色按实际职责组合权限。</p></div><div class="role-summary-count"><strong>${db.roles.filter(x=>x.builtIn).length}</strong><span>内置角色</span><i></i><strong>${db.roles.filter(x=>!x.builtIn).length}</strong><span>自定义角色</span><i></i><strong>${PERMISSION_CODES.length}</strong><span>可选权限码</span></div></div>
<div class="toolbar role-toolbar"><span class="badge green">${icon('shield')}权限码 → 角色 → 成员与范围</span><div class="spacer"></div><button class="btn" data-action="assign-role" ${!can('role.assign')?'disabled':''}>${icon('user')}分配角色</button><button class="btn primary" data-action="create-role" ${!can('role.create')?'disabled':''}>${icon('plus')}创建自定义角色</button></div>
<section class="panel role-layout"><aside class="role-list" aria-label="角色目录">${[['自定义角色',false],['系统内置',true]].map(([label,builtIn])=>`<div class="role-list-label">${label} <span>${available.filter(x=>x.builtIn===builtIn).length}</span></div>${available.filter(x=>x.builtIn===builtIn).map(x=>`<button class="role-choice ${x.id===r.id?'active':''}" data-action="role" data-id="${x.id}">${icon(x.icon)}<span class="grow"><strong>${esc(x.name)}</strong><small>${x.permissions.length} 项权限 · ${x.enabled?'已启用':'已停用'}</small></span>${x.id===r.id?icon('right'):''}</button>`).join('')}`).join('')}</aside>
<div class="role-detail"><div class="between"><div><div class="flex"><h3>${esc(r.name)}</h3><span class="badge ${r.builtIn?'outline':'blue'}">${r.builtIn?'系统内置':'自定义'}</span><span class="badge ${r.enabled?'green':'outline'}">${r.enabled?'已启用':'已停用'}</span></div><p>${esc(r.desc)}</p></div></div><div class="role-detail-actions"><button class="btn small" data-action="clone-role" data-id="${r.id}" ${!can('role.create')?'disabled':''}>${icon('copy')}复制为新角色</button>${!r.builtIn?`<button class="btn small" data-action="edit-role" data-id="${r.id}" ${!can('role.update')?'disabled':''}>${icon('edit')}编辑权限</button><button class="btn small" data-action="toggle-role" data-id="${r.id}" ${!can('role.update')?'disabled':''}>${r.enabled?'停用':'启用'}</button><button class="btn danger small" data-action="delete-role" data-id="${r.id}" ${!can('role.delete')?'disabled':''}>删除</button>`:''}</div>
<div class="role-facts"><div><small>权限码</small><strong>${codes.length} 项 / ${new Set(codes.map(c=>c.group)).size} 个模块</strong></div><div><small>可绑定范围</small><strong>${roleScopeDescription(r)}</strong></div><div><small>已分配</small><strong>${assignments.length} 项绑定</strong></div></div>
<div class="section-head between"><h3>功能权限</h3><small>${r.builtIn?'内置模板可复制后调整':'权限变更会应用到全部已绑定成员'}</small></div><div class="role-code-list">${PERMISSION_GROUPS.filter(g=>codes.some(c=>c.group===g.id)).map(g=>`<section class="role-code-group"><div class="between"><strong>${icon(g.icon)}${g.name}</strong><small>${codes.filter(c=>c.group===g.id).length} 项</small></div>${codes.filter(c=>c.group===g.id).map(p=>`<div class="role-code-row"><span>${icon('check')}${p.label}</span><code>${p.code}</code></div>`).join('')}</section>`).join('')}</div>
<div class="scope-box"><strong>角色权限与资源使用分别配置</strong><p>维护连接配置不会自动获得终端登录、文件传输或数据读写权限。使用权限在“授权规则”中设置；分配授权职责时可限制可授予操作与有效期。</p></div>
<div class="section-head between"><h3>成员与管理范围</h3><button class="text-btn" data-action="assign-role" data-role="${r.id}" ${!can('role.assign')||!r.enabled?'disabled':''}>${icon('plus')}分配此角色</button></div>${assignments.map(({u,b})=>`<div class="role-binding-row"><div class="identity grow">${avatar(u)}<div><strong>${esc(u.name)}</strong><small>${esc(scopeLabel(b.scope))}${team(b.scope)&&b.scope!=='root'?(b.includeChildren?' · 包含下级':' · 仅本级'):''}</small></div></div><button class="text-btn" data-action="member" data-id="${u.id}">查看权限</button>${can('role.assign')?`<button class="text-btn revoke-binding" data-action="revoke-role" data-user="${u.id}" data-id="${r.id}" data-scope="${b.scope}">收回</button>`:''}</div>`).join('')||'<div class="role-no-bindings">尚未分配。保存角色后，可绑定成员及管理范围。</div>'}</div></section>`}
function showRoleEditor(id,clone=false){const source=id?roleById(id):null;if(!can(source&&!clone?'role.update':'role.create')||source?.builtIn&&!clone)return;state.roleDraft={id:clone?null:id||null,name:clone?source.name+' · 副本':source?.name||'',desc:source?.desc||'',permissions:new Set(source?.permissions||[]),category:'all',search:'',selectedOnly:false};openModal(source&&!clone?'编辑自定义角色':'创建自定义角色','勾选功能权限码定义角色。管理范围在分配给成员时设置。',`
<div class="form-grid">${field('角色名称',input('role-name',state.roleDraft.name,'例如：订单生产协作管理员'))}${field('从内置模板开始',selectHTML('role-template',[['blank','从空白开始'],...db.roles.filter(r=>r.builtIn).map(r=>[r.id,r.name])],'blank'))}${field('职责说明',`<textarea id="role-description" aria-label="角色职责说明" placeholder="说明该角色负责的工作">${esc(state.roleDraft.desc)}</textarea>`,'full')}</div>
<div class="permission-heading"><div><h3>选择权限码</h3><p>仅联动必要的查看权限；配置管理与资源使用分别授权。</p></div><span id="permission-selected-count" class="badge green"></span></div>
<div class="permission-editor"><nav class="permission-categories" aria-label="权限模块">${[['all','全部模块','layers'],...PERMISSION_GROUPS.map(g=>[g.id,g.name,g.icon])].map(([id,n,i])=>`<button type="button" class="permission-category ${id==='all'?'active':''}" data-action="permission-category" data-id="${id}">${icon(i)}${n}<span data-category-count="${id}"></span></button>`).join('')}</nav><div class="permission-main"><div class="permission-searchbar"><label class="search">${icon('search')}<input id="permission-search" type="search" placeholder="搜索名称或权限码" aria-label="搜索权限码"></label><label class="inline-check"><input id="permission-selected-only" type="checkbox">仅已选</label></div><div id="permission-options" class="permission-options"></div></div></div><div id="role-impact" class="role-impact"></div>`, `<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-custom-role">${source&&!clone?'保存角色':'创建角色'}</button>`,'role-editor-modal');
 document.querySelector('#role-template').addEventListener('change',e=>{state.roleDraft.permissions=new Set(e.target.value==='blank'?[]:roleById(e.target.value).permissions);renderPermissionPicker()});document.querySelector('#permission-search').addEventListener('input',e=>{state.roleDraft.search=e.target.value;renderPermissionPicker()});document.querySelector('#permission-selected-only').addEventListener('change',e=>{state.roleDraft.selectedOnly=e.target.checked;renderPermissionPicker()});renderPermissionPicker()}
function changePermission(code,checked){const draft=state.roleDraft.permissions;if(checked){draft.add(code);const dep=permissionByCode(code)?.requires;if(dep)changePermission(dep,true)}else{draft.delete(code);PERMISSION_CODES.filter(p=>p.requires===code).forEach(p=>changePermission(p.code,false))}}
function renderPermissionPicker(){const d=state.roleDraft,query=d.search.toLowerCase();const visible=PERMISSION_CODES.filter(p=>(d.category==='all'||p.group===d.category)&&(!d.selectedOnly||d.permissions.has(p.code))&&[p.code,p.label].some(v=>v.toLowerCase().includes(query)));document.querySelector('#permission-options').innerHTML=PERMISSION_GROUPS.filter(g=>visible.some(p=>p.group===g.id)).map(g=>{const items=visible.filter(p=>p.group===g.id);return`<section class="permission-module"><label class="permission-module-heading"><input class="permission-group-check" type="checkbox" data-group="${g.id}" ${items.every(p=>d.permissions.has(p.code))?'checked':''}><strong>${g.name}</strong><small>${items.filter(p=>d.permissions.has(p.code)).length} / ${items.length}</small></label>${items.map(p=>`<label class="permission-option ${d.permissions.has(p.code)?'selected':''}"><input class="permission-code" type="checkbox" data-code="${p.code}" ${d.permissions.has(p.code)?'checked':''}><span class="grow"><strong>${p.label}</strong><code>${p.code}</code></span>${p.scope==='org'?'<span class="badge outline">组织级</span>':p.requires?'<small title="依赖 '+p.requires+'">含查看权限</small>':''}</label>`).join('')}</section>`}).join('')||'<div class="empty"><strong>没有匹配的权限码</strong>调整搜索条件或切换模块。</div>';document.querySelector('#permission-selected-count').textContent='已选 '+d.permissions.size+' / '+PERMISSION_CODES.length;document.querySelectorAll('[data-category-count]').forEach(el=>el.textContent=PERMISSION_CODES.filter(p=>d.permissions.has(p.code)&&(el.dataset.categoryCount==='all'||p.group===el.dataset.categoryCount)).length);document.querySelectorAll('.permission-category').forEach(el=>el.classList.toggle('active',el.dataset.id===d.category));document.querySelectorAll('.permission-code').forEach(el=>el.addEventListener('change',()=>{changePermission(el.dataset.code,el.checked);renderPermissionPicker()}));document.querySelectorAll('.permission-group-check').forEach(el=>{const groupItems=visible.filter(p=>p.group===el.dataset.group);el.indeterminate=groupItems.some(p=>d.permissions.has(p.code))&&!groupItems.every(p=>d.permissions.has(p.code));el.addEventListener('change',()=>{groupItems.forEach(p=>changePermission(p.code,el.checked));renderPermissionPicker()})});const count=d.id?roleAssignments(d.id).length:0;document.querySelector('#role-impact').innerHTML=`${icon('info')}<span>${d.id?'保存后更新 '+count+' 项成员绑定的功能权限，现有资源使用授权继续按规则计算。':'创建角色后再分配成员和范围，角色本身不会授予资源使用权限。'}${[...d.permissions].some(c=>permissionByCode(c)?.scope==='org')?' 当前含组织级权限，分配时需绑定整个组织。':''}</span>`}
function saveCustomRole(){const d=state.roleDraft;if(!can(d.id?'role.update':'role.create'))return error('没有保存角色的权限');const name=document.querySelector('#role-name').value.trim(),desc=document.querySelector('#role-description').value.trim();if(!name)return error('请输入角色名称');if(name.length>40)return error('角色名称最多 40 个字符');if(db.roles.some(r=>r.id!==d.id&&r.name===name))return error('角色名称已存在');if(!d.permissions.size)return error('至少选择一个权限码');const data={name,desc:desc||'按所选权限码定义的自定义职责。',permissions:PERMISSION_CODES.map(p=>p.code).filter(c=>d.permissions.has(c))};if(d.id){const r=roleById(d.id);if(r.builtIn)return error('内置角色请复制后调整');const prospective={...r,...data};const valid=new Set(assignmentScopeOptions(prospective).map(([id])=>id));if(roleAssignments(r.id).some(({b})=>!valid.has(b.scope)))return error('新增权限超出已有绑定范围，请先调整绑定，或复制为新角色');Object.assign(r,data)}else{d.id='custom_'+Date.now();db.roles.unshift({id:d.id,...data,icon:'key',builtIn:false,enabled:true,createdBy:current().name})}state.role=d.id;state.tab='roles';record('保存角色',name,data.permissions.length+' 个权限码；功能与使用授权分别配置。');persist();closeModal();render();toast('角色已保存，可继续分配成员与范围')}
function toggleRole(id){const r=roleById(id);if(!can('role.update')||r.builtIn)return;openModal(r.enabled?'停用自定义角色':'启用自定义角色',r.name,`<div class="management-card"><h3>${roleAssignments(id).length} 项成员绑定</h3><p>${r.enabled?'停用后，这些绑定的功能权限立即停止生效。':'启用后，现有成员绑定恢复生效。'}资源使用授权仍按独立规则计算。</p></div>`, `<button class="btn" data-action="close-modal">取消</button><button class="btn ${r.enabled?'danger':'primary'}" data-action="confirm-toggle-role" data-id="${id}">确认${r.enabled?'停用':'启用'}</button>`,'narrow')}
function confirmToggleRole(id){if(!can('role.update'))return;const r=roleById(id);if(r.builtIn)return;r.enabled=!r.enabled;record(r.enabled?'启用角色':'停用角色',r.name,roleAssignments(id).length+' 项绑定；资源使用授权独立计算。');persist();closeModal();render();toast(r.enabled?'角色已启用':'角色已停用')}
function deleteRole(id){const r=roleById(id);if(!can('role.delete')||r.builtIn)return;const count=roleAssignments(id).length;openModal('删除自定义角色',r.name,`<div class="management-card"><h3>${count?'该角色仍有 '+count+' 项成员绑定':'该角色尚未分配'}</h3><p>${count?'请先收回成员绑定，再删除角色。':'删除角色后，资源授权与历史台账继续保留。'}</p></div>`, `<button class="btn" data-action="close-modal">关闭</button>${count?'':`<button class="btn danger" data-action="confirm-delete-role" data-id="${id}">删除角色</button>`}`,'narrow')}
function confirmDeleteRole(id){const r=roleById(id);if(!can('role.delete')||r.builtIn||roleAssignments(id).length)return;db.roles=db.roles.filter(x=>x.id!==id);record('删除角色',r.name,'删除未分配的自定义角色。');state.role=db.roles[0].id;persist();closeModal();render();toast('角色已删除')}
function showRoleAssign(preselect){if(!can('role.assign'))return;const roles=db.roles.filter(r=>r.enabled);openModal('分配角色与管理范围','权限码定义能做什么，绑定范围定义在哪些资源上生效。',`<div class="form-grid">${field('成员',selectHTML('assign-user',db.users.map(u=>[u.id,u.name]),'u8'),'full')}${field('角色',selectHTML('assign-role',roles.map(r=>[r.id,r.name+(r.builtIn?' · 内置':' · 自定义')]),preselect||state.role),'full')}${field('管理范围','<div id="assign-scope-host"></div>','full')}<div id="assign-descendants-host" class="full"></div><div id="assign-delegation-host" class="full"></div></div><div id="assign-role-preview" class="preview-line"></div>`, `<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-role">确认分配</button>`,'narrow');document.querySelector('#assign-role').addEventListener('change',refreshRoleScope);refreshRoleScope()}
function refreshRoleScope(){state.assignmentScope=null;const r=roleById(document.querySelector('#assign-role').value),options=assignmentScopeOptions(r);document.querySelector('#assign-scope-host').innerHTML=selectHTML('assign-scope',options,options.some(([id])=>id===state.team)?state.team:options[0][0]);const delegated=r.permissions.some(c=>['authorization.create','authorization.update','approval.approve'].includes(c));document.querySelector('#assign-delegation-host').innerHTML=delegated?`<div class="form-section" style="margin-top:10px">授权委派上限</div><div class="form-grid">${field('可授予操作',selectHTML('assign-permission-limit',[['read','只读与查看'],['operations','日常运维'],['manage','全部使用操作']],'read'))}${field('最长有效期',selectHTML('assign-duration-limit',[['2','2 小时'],['24','24 小时'],['168','7 天'],['forever','允许永久']],'24'))}</div>`:'';document.querySelector('#assign-scope').addEventListener('change',refreshAssignmentPreview);document.querySelectorAll('#assign-permission-limit,#assign-duration-limit').forEach(el=>el.addEventListener('change',refreshAssignmentPreview));refreshAssignmentPreview()}
function refreshAssignmentPreview(){const scope=document.querySelector('#assign-scope').value,r=roleById(document.querySelector('#assign-role').value),host=document.querySelector('#assign-descendants-host'),includeChildren=state.assignmentScope===scope&&document.querySelector('#assign-descendants')?.checked;state.assignmentScope=scope;host.innerHTML=team(scope)&&scope!=='root'?`<label class="inline-check"><input id="assign-descendants" type="checkbox" ${includeChildren?'checked':''}>包含下级子组织</label>`:'';document.querySelector('#assign-role-preview').innerHTML=`<strong>${esc(r.name)}</strong> · ${r.permissions.length} 个权限码<br>管理范围：${esc(scopeLabel(scope))}<br><small>管理角色不会自动增加资源登录或数据读写权限。</small>`}
function saveRole(){if(!can('role.assign'))return error('没有分配角色的权限');const uid=document.querySelector('#assign-user').value,rid=document.querySelector('#assign-role').value,scope=document.querySelector('#assign-scope').value,u=user(uid),r=roleById(rid);if(!r.enabled)return error('该角色已停用');if(!assignmentScopeOptions(r).some(([id])=>id===scope))return error('管理范围不适用于当前权限码');if(u.roles.some(b=>b.id===rid&&b.scope===scope))return error('该成员已拥有此角色与管理范围');const binding={id:rid,scope,includeChildren:document.querySelector('#assign-descendants')?.checked||scope==='root'};if(document.querySelector('#assign-permission-limit')){const max=document.querySelector('#assign-duration-limit').value;binding.delegation={perms:grantDefaults(document.querySelector('#assign-permission-limit').value),maxHours:max==='forever'?null:Number(max)}}u.roles.push(binding);record('分配角色',u.name,r.name+' · '+scopeLabel(scope)+(binding.includeChildren?' · 包含下级':''));persist();closeModal();render();toast('角色与管理范围已分配')}
function revokeRole(uid,rid,scope){if(!can('role.assign'))return;openModal('收回角色绑定',user(uid).name+' · '+roleById(rid).name,`<div class="management-card"><h3>${esc(scopeLabel(scope))}</h3><p>收回此项管理职责，其他角色绑定与资源使用授权继续独立计算。</p></div>`, `<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-revoke-role" data-user="${uid}" data-id="${rid}" data-scope="${scope}">确认收回</button>`,'narrow')}
function confirmRevokeRole(uid,rid,scope){if(!can('role.assign'))return;const u=user(uid),remaining=db.users.flatMap(x=>x.roles.filter(b=>!(x.id===uid&&b.id===rid&&b.scope===scope)).map(b=>({u:x,b})));if(!remaining.some(({b})=>b.scope==='root'&&roleById(b.id)?.enabled&&roleById(b.id).permissions.includes('role.assign')))return error('至少保留一名可以分配角色的组织成员');u.roles=u.roles.filter(b=>!(b.id===rid&&b.scope===scope));record('收回角色',u.name,roleById(rid).name+' · '+scopeLabel(scope));persist();closeModal();render();toast('角色绑定已收回')}

function localDateTime(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function showResourceConfig(eid,cap,rid){if(!can('resource.'+cap+'.configure',eid))return;const r=resourcesFor(env(eid),cap).find(r=>r.id===rid);openModal('维护'+CAPS[cap].label+'配置',env(eid).name,`${field('资源名称',input('resource-name',r.name,'资源名称'))}${field('连接或来源信息',input('resource-meta',r.meta,'例如：app.example.com'))}<div class="notice">${icon('key')}配置维护由角色权限码和绑定范围决定，登录与数据操作另行授权。</div>`, `<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-resource" data-env="${eid}" data-cap="${cap}" data-id="${rid}">保存配置</button>`,'narrow')}
function saveResourceConfig(eid,cap,rid){if(!can('resource.'+cap+'.configure',eid))return error('没有维护此类资源配置的权限');const name=document.querySelector('#resource-name').value.trim(),meta=document.querySelector('#resource-meta').value.trim();if(!name)return error('请输入资源名称');db.resourceOverrides[rid]={name,meta};record('维护资源配置',name,CAPS[cap].label+' · '+env(eid).name);persist();closeModal();renderDetail();toast('资源配置已保存')}
function visibleEvents(){return db.events.filter(ev=>can('audit.view')||ev.envs?.some(id=>can('audit.view',id))||ev.team&&can('audit.view',ev.team))}

function cloneGrant(id){const g=db.grants.find(x=>x.id===id);if(!canAuthorize(g.envs))return;showGrant(null,g.envs[0]);document.querySelector('#grant-name').value=g.name+' · 副本';document.querySelector('#grant-reason').value=g.reason;document.querySelector('#grant-subject-type').value=g.subjectType==='team'?'team':'user';document.querySelector('#grant-subject-type').dispatchEvent(new Event('change'));document.querySelector('#grant-subject').value=g.subject;document.querySelectorAll('input[name="grant-env"]').forEach(el=>el.checked=g.envs.includes(el.value));document.querySelectorAll('.permission-check').forEach(el=>el.checked=g.perms[el.dataset.cap]?.includes(el.value)||false);document.querySelector('#grant-range').value=g.future?'all':'selected';document.querySelector('#grant-duration').value=g.expires?'custom':'forever';document.querySelector('#grant-start').value=localDateTime(g.starts);const accounts=g.account.split(' / ');if(g.perms.ssh&&['observer','deploy','ops'].includes(accounts[0]))document.querySelector('#grant-ssh-account').value=accounts[0];const dbAccount=accounts.find(a=>['app_reader','app_writer'].includes(a));if(dbAccount)document.querySelector('#grant-db-account').value=dbAccount;refreshEnd(g.expires);refreshResourcePicker(g.items);refreshGrantPreview()}

function showReview(id){const r=db.requests.find(x=>x.id===id);const actorAllowed=can('approval.override')||state.persona===(r.stage===0?r.workflow.first:r.workflow.second);const canReject=r.status==='pending'&&actorAllowed&&can('approval.reject',r.env)&&(r.workflow.self||r.user!==state.persona);const canAct=r.status==='pending'&&(can('approval.approve',r.env)&&(can('approval.override')||state.persona===(r.stage===0?r.workflow.first:r.workflow.second)))&&(r.workflow.self||r.user!==state.persona);openModal('授权申请详情',r.name,`<div class="between" style="margin-bottom:20px"><div class="identity">${avatar(user(r.user))}<div><strong>${user(r.user).name}</strong><small>申请于 ${r.created}</small></div></div><span class="badge ${r.status==='pending'?'amber':r.status==='approved'?'green':'outline'}">${({pending:'待审批',approved:'已通过',rejected:'已拒绝',withdrawn:'已撤回'})[r.status]}</span></div><div class="management-card"><h3>${env(r.env).name}</h3><p>${esc(permText(r.perms))}</p><p>登录账号：${esc(r.account)} · 有效期：${esc(r.duration)}</p><p>对象范围：${r.future===true?'全部资源，含以后新增':(r.objects||Object.values(r.items||{}).flat()).map(o=>Object.keys(CAPS).flatMap(c=>resourcesFor(env(r.env),c)).find(x=>x.id===o)?.name||o).join('、')||'指定资源'}</p></div><div class="management-card"><h3>申请理由</h3><p>${esc(r.reason)}</p></div><div class="review-flow">${[[r.workflow.first,'团队负责人确认'],[r.workflow.second,'授权管理员审核']].map(([uid,label],i)=>`<div class="review-stage"><span class="stage-number ${i===r.stage&&r.status==='pending'?'pending':''}">${i<r.stage?icon('check'):i+1}</span><div class="grow"><strong>${label}</strong><p>${user(uid).name} · ${i<r.stage?'已通过':i===r.stage&&r.status==='pending'?'等待审批':'未开始'}</p></div>${i===r.stage&&r.status==='pending'?'<span class="badge amber">当前节点</span>':''}</div>`).join('')}</div>${r.status==='pending'?field(canAct||canReject?'审批意见':'撤回原因','<textarea id="decision-reason" aria-label="处理原因" placeholder="填写处理原因"></textarea>'):''}${r.status==='pending'&&r.user===state.persona&&!r.workflow.self?'<div class="notice">'+icon('lock')+'当前流程不允许自审批，请其他审批人处理。</div>':''}`,`${r.status==='pending'&&r.user===state.persona?`<button class="btn" data-action="decision" data-id="${id}" data-decision="withdraw">撤回申请</button>`:''}<button class="btn" data-action="close-modal">关闭</button>${canReject?`<button class="btn danger" data-action="decision" data-id="${id}" data-decision="reject">拒绝</button>`:''}${canAct?`<button class="btn primary" data-action="decision" data-id="${id}" data-decision="approve">通过当前节点</button>`:''}`,'narrow')}
function decide(id,decision){const r=db.requests.find(x=>x.id===id),reason=document.querySelector('#decision-reason')?.value.trim();if(!reason)return error('请填写处理原因');if(r.status!=='pending')return error('该申请已处理');if(decision==='approve'&&r.stage===1&&r.expires&&new Date(r.expires)<=new Date())return error('申请的有效期已结束，请重新申请');if(decision==='approve'&&r.stage===1&&!withinDelegation([r.env],r.perms,r.starts,r.expires||(r.duration==='永久'?null:new Date(Date.now()+(parseInt(r.duration)||2)*3600000).toISOString()),'approval.approve'))return error('申请超出当前审批人的授权委派上限');if(decision==='withdraw'){if(r.user!==state.persona)return error('只能撤回自己的申请');r.status='withdrawn'}else{if(!can(decision==='reject'?'approval.reject':'approval.approve',r.env)||!(can('approval.override')||state.persona===(r.stage===0?r.workflow.first:r.workflow.second)))return error('没有当前节点的审批操作权限');if(!r.workflow.self&&r.user===state.persona)return error('当前流程不允许自审批');if(decision==='reject')r.status='rejected';else{r.stage++;if(r.stage>=2){r.status='approved';const seconds=parseInt(r.duration)||2,expires=r.expires||(r.duration==='永久'?null:new Date(Date.now()+seconds*3600000).toISOString());if(expires&&new Date(expires)<=new Date())return error('申请的有效期已结束，请重新申请');db.grants.push({id:'g'+Date.now(),name:r.name,subjectType:'user',subject:r.user,envs:[r.env],perms:r.perms,account:r.account,starts:r.starts||null,expires,source:'request',future:r.future===true,items:r.items||Object.fromEntries(Object.keys(r.perms).map(c=>[c,(r.objects||[]).filter(o=>o.includes(':'+c+'-'))])),reason:r.reason});record('授权生效',r.name,'审批完成；'+permText(r.perms))}}}record(decision==='approve'?'节点通过':decision==='reject'?'拒绝申请':'撤回申请',r.name,reason);persist();render();showReview(id);toast(decision==='approve'?(r.status==='approved'?'审批完成，授权已生效':'当前节点已通过，流转至下一节点'):decision==='reject'?'申请已拒绝':'申请已撤回')}
function showWorkflow(){if(!can('approval.workflow'))return;openModal('配置授权审批流程','按顺序流转，全部节点通过后产生资源使用授权。',`<div class="workflow-setting"><h3>01 · 团队负责人确认</h3>${field('审批人',selectHTML('workflow-first',db.users.map(u=>[u.id,u.name]),db.workflow.first))}</div><div class="workflow-setting"><h3>02 · 授权管理员审核</h3>${field('审批人',selectHTML('workflow-second',db.users.map(u=>[u.id,u.name]),db.workflow.second))}</div><label class="inline-check"><input type="checkbox" id="workflow-self" ${db.workflow.self?'checked':''}>允许审批人审批自己的申请</label><small>流程修改只影响新申请。本原型演示两级流程，Viron 已支持多级与会签审批。</small>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-workflow">保存流程</button>`,'narrow')}
function showSettings(){openModal('原型设置','全部操作仅改变本浏览器中的示例数据。',`<div class="management-card"><h3>恢复初始数据</h3><p>清除新增的子组织、环境、授权和审批变更，重新载入演示数据。</p><button class="btn danger small" style="margin-top:15px" data-action="reset-data">恢复示例数据</button></div><div class="management-card"><h3>单文件使用</h3><p>HTML 包含全部样式、脚本、图标和示例数据，可以直接打开；无需构建或网络连接。</p></div>`,null,'narrow')}
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const a=button.dataset.action,id=button.dataset.id;
 if(a==='close-detail'&&event.target!==button&&button.classList.contains('overlay'))return;
 if(a==='close-modal'&&event.target!==button&&button.classList.contains('modal-wrap'))return;
 switch(a){case'team':state.place='org';state.team=id;state.search='';state.filter='all';state.sidebar=false;state.showUnowned=false;closeDetail();render();break;case'tab':state.place='org';state.tab=id;state.search='';state.filter='all';render();break;case'filter':state.filter=id;render();break;case'lens':state.lens=id;state.search='';state.showUnowned=false;render();break;case'toggle-unowned':state.showUnowned=!state.showUnowned;render();break;case'sidebar':state.sidebar=!state.sidebar;render();break;case'mine':state.place='mine';state.search='';state.sidebar=false;closeDetail();render();break;case'mine-tab':state.mineTab=id;render();break;case'nav-environments':state.place='org';state.tab='environments';state.lens='environment';state.search='';state.filter='all';state.showUnowned=false;render();break;
 case'notes':showNotes();break;case'settings':showSettings();break;case'reset-data':db=structuredClone(SEED);ensureConnections();persist();Object.assign(state,{team:'root',tab:'environments',persona:'u1',search:'',filter:'all',detail:null,lens:'environment',showUnowned:false,place:'org',mineTab:'grants'});closeModal();closeDetail();render();toast('已恢复初始示例数据');break;case'reset-persona':state.persona='u1';render();break;case'profile':openDetail('member',state.persona);break;
 case'environment':openDetail('environment',id);break;case'connection':openDetail('connection',id);break;case'member':openDetail('member',id);break;case'grant-detail':openDetail('grant',id);break;case'close-detail':closeDetail();break;case'detail-tab':state.detailTab=id;renderDetail();break;case'close-modal':closeModal();break;
 case'create-team':showTeam();break;case'save-team':saveTeam();break;case'create-env':showEnvironment();break;case'edit-env':showEnvironment(id);break;case'save-env':saveEnvironment(id);break;
 case'configure-resource':showResourceConfig(button.dataset.env,button.dataset.cap,id);break;case'save-resource':saveResourceConfig(button.dataset.env,button.dataset.cap,id);break;case'export-events':exportEvents();break;case'clone-grant':cloneGrant(id);break;case'toggle-grant':toggleGrant(id);break;case'confirm-toggle-grant':confirmToggleGrant(id);break;case'grant':showGrant(null,button.dataset.env);break;case'edit-grant':showGrant(id);break;case'save-grant':saveGrant(button.dataset.request==='true');break;case'request':showGrant(null,null,true);break;case'revoke':showRevoke(id);break;case'confirm-revoke':confirmRevoke(id);break;
 case'role':state.role=id;render();break;case'create-role':showRoleEditor();break;case'clone-role':showRoleEditor(id,true);break;case'edit-role':showRoleEditor(id);break;case'save-custom-role':saveCustomRole();break;case'permission-category':state.roleDraft.category=id;renderPermissionPicker();break;case'toggle-role':toggleRole(id);break;case'confirm-toggle-role':confirmToggleRole(id);break;case'delete-role':deleteRole(id);break;case'confirm-delete-role':confirmDeleteRole(id);break;case'revoke-role':revokeRole(button.dataset.user,id,button.dataset.scope);break;case'confirm-revoke-role':confirmRevokeRole(button.dataset.user,id,button.dataset.scope);break;case'assign-role':showRoleAssign(button.dataset.role);break;case'save-role':saveRole();break;case'invitation':showInvitation();break;case'generate-invite':generateInvite();break;case'invitations':showInvitations();break;case'copy-invite':try{await navigator.clipboard.writeText(button.dataset.link);toast('示例链接已复制')}catch{openModal('复制示例链接','选中下方文字复制。',`<input style="width:100%;padding:12px" readonly value="${esc(button.dataset.link)}" aria-label="示例邀请链接">`,null,'narrow')}break;case'revoke-invite':db.invitations.find(i=>i.id===id).active=false;persist();showInvitations();toast('邀请链接已撤销');break;
 case'review-tab':state.reviewTab=id;render();break;case'review':showReview(id);break;case'decision':decide(id,button.dataset.decision);break;case'workflow':showWorkflow();break;case'save-workflow':db.workflow={first:document.querySelector('#workflow-first').value,second:document.querySelector('#workflow-second').value,self:document.querySelector('#workflow-self').checked};record('配置审批流程','授权申请流程',user(db.workflow.first).name+' → '+user(db.workflow.second).name);persist();closeModal();render();toast('审批流程已保存');break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('#modal-root').innerHTML)closeModal();else if(state.detail)closeDetail();else if(state.sidebar){state.sidebar=false;render()}}if(e.key==='Enter'&&e.target.matches('tr[data-action]')){e.preventDefault();e.target.click()}if(e.key==='Tab'){const dialog=document.querySelector('#modal-root [role="dialog"]')||document.querySelector('#detail-root [role="dialog"]');if(!dialog)return;const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
</body>
